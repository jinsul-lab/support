<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>jinsul-add v2.2.15.5 (UI Redesign & Roadview Fix)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,drawing,clusterer"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <style>
    /* === Design System === */
    :root { 
      --blue:#228be6; --blue-light:#e7f5ff;
      --red:#fa5252; --red-light:#fff5f5;
      --border:#dee2e6; --text:#343a40; --bg:#f8f9fa; --card:#fff;
      --c-new:#ff0000; --c-conv:#00c853; --c-90:#ffd400; --c-ret:#228be6;
      --shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    *{box-sizing:border-box;font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;}
    
    .app{display:flex;height:100%;width:100%;}
    
    /* Sidebar */
    .sidebar{width:360px;min-width:360px;height:100%;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;}
    .sidebarHeader{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .brand{font-weight:900;font-size:16px;}
    .sidebarBody{flex:1;overflow-y:auto;padding:15px;}
    
    /* Sections */
    .section{background:#fff;border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:12px;}
    .sectionTitle{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
    .pill{font-size:10px;background:var(--blue);color:white;padding:3px 6px;border-radius:4px;font-weight:normal;}
    
    /* Upload Box */
    .uploadBox{border:2px dashed #adb5bd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#f8f9fa;transition:0.2s;}
    .uploadBox:hover, .uploadBox.dragover{border-color:var(--blue);background:var(--blue-light);}
    
    /* Stats Grid */
    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;background:#f8f9fa;padding:10px;border-radius:6px;}
    .statItem{text-align:center;}
    .statLabel{font-size:11px;color:#868e96;margin-bottom:2px;}
    .statValue{font-size:16px;font-weight:800;color:var(--text);}
    
    /* Input Group */
    .input-group { display: flex; gap: 5px; margin-bottom: 5px; }
    .input-box { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    
    /* Toggle Switch */
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #f1f3f5; }
    .row:last-child { border-bottom: none; }
    .toggle { width: 36px; height: 20px; background: #e9ecef; border-radius: 20px; position: relative; cursor: pointer; transition: 0.3s; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: 0.3s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .toggle.on { background: var(--blue); }
    .toggle.on::after { transform: translateX(16px); }
    
    /* Buttons */
    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .btn{width:100%;padding:10px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:12px;transition:0.2s;}
    .btn.primary{background:var(--blue);color:white;}
    .btn.danger{background:var(--red-light);color:var(--red);}
    .btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}

    /* Search Grid */
    .search-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .search-btn{
      padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
      font-weight:600;color:#495057; transition:0.2s;
    }
    .search-btn.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}

    /* Map Area */
    .mapArea{flex:1;position:relative;}
    #map{width:100%;height:100%;}

    /* Info Overlay */
    .info-overlay {
      background: #fff; border: 2px solid #333; border-radius: 6px;
      padding: 8px 12px; font-size: 13px; font-weight: 800; color: #000;
      white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none;
      z-index: 99999 !important;
    }

    /* Modal */
    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;justify-content:center;align-items:center;}
    .modalPanel{width:90%;max-width:800px;background:white;border-radius:12px;height:85vh;display:flex;flex-direction:column;}
    .modalHeader{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px;}
    .modalBody{flex:1;overflow-y:auto;padding:20px;}
    .tabBar{display:flex;gap:10px;margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px;}
    .tabBtn{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer;font-size:13px;}
    .tabBtn.active{background:#333;color:white;border-color:#333;}
    .tabPane{display:none;}
    table.miniTable{width:100%;border-collapse:collapse;text-align:center;font-size:12px;}
    table.miniTable th{background:#f8f9fa;padding:8px;position:sticky;top:0;z-index:10;}
    table.miniTable td{padding:8px;border-bottom:1px solid #eee;}

    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;}
    #toast.show{opacity:1;bottom:50px;}
    
    /* Legend */
    #mapLegend{
      position:absolute;top:12px;left:12px;z-index:20;
      background:rgba(255,255,255,0.95);padding:10px;border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);font-size:11px;
      display:flex;flex-direction:column;gap:5px;
    }
    .legend-item{display:flex;align-items:center;gap:6px;}
    .dot{width:10px;height:10px;border-radius:50%;}
  
    /* === Kakao Radius Info Box (Official Style) === */
    .info {
      position: relative; border-radius: 6px; border: 1px solid #ccc;
      border-bottom: 2px solid #ddd; font-size: 12px; padding: 6px 8px;
      background: #fff; list-style: none; margin: 0;
      box-shadow: 0px 1px 2px rgba(0,0,0,0.3);
    }
    .info .label { display:inline-block; width:50px; color:#555; }
    .number { font-weight:bold; color:#00a0e9; }

    /* === NEW UI: Map Controls (Top Right) === */
    .map-controls-container {
      position: absolute; top: 12px; right: 12px; z-index: 150;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }

    /* 1. Horizontal Map Type Control */
    .map-type-group {
      display: flex; background: white; border-radius: 4px; 
      box-shadow: var(--shadow); overflow: hidden; border: 1px solid #b8b8b8;
    }
    .map-type-btn {
      padding: 7px 12px; border: none; background: white; 
      font-size: 12px; font-weight: 600; color: #444; cursor: pointer;
      border-right: 1px solid #ddd; transition: 0.1s;
    }
    .map-type-btn:last-child { border-right: none; }
    .map-type-btn:hover { background: #f1f1f1; }
    .map-type-btn.active { background: #228be6; color: white; }

    /* 2. Vertical Toolbar */
    .vertical-toolbar {
      width: 44px; background: white; border-radius: 4px;
      box-shadow: var(--shadow); border: 1px solid #b8b8b8;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .v-tool-btn {
      width: 44px; height: 44px; border: none; background: white;
      cursor: pointer; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; gap: 2px;
      border-bottom: 1px solid #eee; color: #333;
      transition: 0.1s;
    }
    .v-tool-btn:last-child { border-bottom: none; }
    .v-tool-btn span { font-size: 18px; } /* Icon size */
    .v-tool-btn .lbl { font-size: 9px; font-weight: 600; line-height: 1; color: #666; }
    
    .v-tool-btn:hover { background: #f8f9fa; }
    .v-tool-btn.active { background: #e7f5ff; color: #228be6; }
    .v-tool-btn.active .lbl { color: #228be6; }
    
    .v-tool-btn.danger { color: #fa5252; }
    .v-tool-btn.danger .lbl { color: #fa5252; }

    /* Divider */
    .v-divider { height: 4px; background: #f1f3f5; border-bottom: 1px solid #eee; }

    /* === Roadview Window === */
    #roadviewModal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; height: 70%; background: black; z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
      border-radius: 8px; overflow: hidden; border: 2px solid white;
    }
    #roadviewContainer { width: 100%; height: 100%; }
    .rv-close {
      position: absolute; top: 10px; right: 10px; z-index: 2001;
      background: white; border: none; border-radius: 4px; 
      padding: 5px 10px; font-weight: bold; cursor: pointer;
    }

</style>

<script>
const WALK_SPEED = 67;
const BIKE_SPEED = 227;
</script>

</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebarHeader">
      <div class="brand">jinsul-add v2.2.15.5</div>
      <div style="font-size:18px;cursor:pointer;">≡</div>
    </div>

    <div class="sidebarBody">
      <div class="section">
        <div class="sectionTitle">우리 병원 설정 <span class="pill">기준점</span></div>
        <div class="input-group">
          <input type="text" id="myHospitalInput" class="input-box" placeholder="병원명 또는 주소 입력 (엔터)">
          <button id="btnSetHospital" class="btn primary" style="width:50px;padding:0;">설정</button>
        </div>
        <div style="font-size:11px;color:#888;">* 검색 후 지도에 파란 십자가 마커가 표시됩니다.</div>
      </div>

      <div class="section">
        <div class="sectionTitle">환자 데이터 <span class="pill">BIT/의사랑</span></div>
        <div id="uploadBox" class="uploadBox" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:24px;margin-bottom:5px;">📂</div>
          <div style="font-weight:bold;">파일 선택 (드래그 가능)</div>
          <input id="fileInput" type="file" accept=".xls,.xlsx,.csv" style="display:none"/>
        </div>
        
        <div class="statGrid">
          <div class="statItem" style="border-right:1px solid #eee;">
            <div class="statLabel">총 데이터</div>
            <div class="statValue" id="statTotalUsers">0</div>
          </div>
          <div class="statItem">
            <div class="statLabel">현재 조회</div>
            <div class="statValue" id="statFilteredUsers" style="color:var(--blue);">0</div>
          </div>
        </div>
        
        <div class="btnRow">
          <button id="btnClear" class="btn danger">초기화</button>
          <button id="btnFit" class="btn primary">전체 보기</button>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle">환자 필터 <span class="pill">토글 제어</span></div>
        
        <div class="row">
          <span style="font-weight:bold;">전체 보기</span> 
          <div class="toggle on" data-toggle="all"></div>
        </div>
        
        <div class="row">
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot" style="background:var(--c-new)"></div> 신환 (1회만)
          </div>
          <div class="toggle on" data-toggle="new_only"></div>
        </div>

        <div class="row" style="background:#fcfcfc; padding-left:20px;">
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot" style="background:var(--c-conv)"></div> └ 신환 ▶ 재진 전환
          </div>
          <div class="toggle on" data-toggle="new_conv"></div>
        </div>
        
        <div class="row">
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot" style="background:var(--c-90)"></div> 90일초 (비트O)
          </div>
          <div class="toggle on" data-toggle="bit_90"></div>
        </div>

        <div class="row">
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="dot" style="background:var(--c-ret)"></div> 재진
          </div>
          <div class="toggle on" data-toggle="old"></div>
        </div>

        <button id="btnStats" class="btn outline" style="width:100%;margin-top:10px;">📊 상세 분석 (행정동/연령)</button>
      </div>

      <div class="section">
        <div class="sectionTitle">시설 검색 <span class="pill">16분할 스캔</span></div>
        <div class="search-grid">
          <div class="search-btn" data-target="senior"><span>🏠</span> 경로당</div>
          <div class="search-btn" data-target="welfare"><span>💜</span> 노인재가</div>
          <div class="search-btn" data-target="ortho" style="grid-column:span 2;"><span>🏥</span> 경쟁 병원</div>
        </div>
        <div class="btnRow">
          <button id="btnSearch" class="btn primary">검색</button>
          <button id="btnResetSearch" class="btn danger">지우기</button>
        </div>
        <div style="text-align:center;margin-top:5px;font-size:11px;color:#888;">
          상태: <span id="searchStatus">대기</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="mapArea">
    <div id="map"></div>
    
    <div class="map-controls-container">
      
      <div class="map-type-group">
        <button class="map-type-btn active" id="btnMapRoad">일반지도</button>
        <button class="map-type-btn" id="btnMapSky">위성지도</button>
        <button class="map-type-btn" id="btnMapTopo">지형도</button>
      </div>

      <div class="vertical-toolbar">
        <button class="v-tool-btn" id="btnCadastral" title="지적편집도">
          <span>📅</span><div class="lbl">지적</div>
        </button>
        <button class="v-tool-btn" id="btnRoadview" title="로드뷰">
          <span>📷</span><div class="lbl">로드뷰</div>
        </button>
        
        <div class="v-divider"></div>

        <button class="v-tool-btn" id="btnRadius" title="반경">
          <span>◎</span><div class="lbl">반경</div>
        </button>
        <button class="v-tool-btn" id="btnArea" title="면적">
          <span>▨</span><div class="lbl">면적</div>
        </button>
        <button class="v-tool-btn" id="btnDist" title="거리">
          <span>📏</span><div class="lbl">거리</div>
        </button>
        
        <div class="v-divider"></div>

        <button class="v-tool-btn" id="btnTraffic" title="교통정보">
          <span>🚦</span><div class="lbl">교통</div>
        </button>
        <button class="v-tool-btn" id="btnBike" title="자전거도로">
          <span>🚲</span><div class="lbl">자전거</div>
        </button>

        <div class="v-divider"></div>

        <button class="v-tool-btn danger" id="btnClearTools" title="모두 지우기">
          <span>🗑️</span><div class="lbl">삭제</div>
        </button>
      </div>
    </div>

    <div id="mapLegend">
      <div style="font-weight:bold;margin-bottom:4px;">환자 분류</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-new)"></div> 신환 (1회)</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-conv)"></div> 재진 전환</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-90)"></div> 90일초</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-ret)"></div> 재진</div>
      <hr style="margin:5px 0;border:none;border-top:1px solid #eee;">
      <div class="legend-item"><div style="font-size:14px;">🏥</div> 우리 병원</div>
    </div>

    <div id="roadviewModal">
      <div id="roadviewContainer"></div>
      <button class="rv-close" id="btnCloseRoadview">로드뷰 닫기</button>
    </div>

  </main>
</div>

<div id="statsModal" class="modalBack">
  <div class="modalPanel">
    <div class="modalHeader">
      <span>상세 통계 분석</span>
      <span onclick="document.getElementById('statsModal').style.display='none'" style="cursor:pointer;font-size:20px;">✕</span>
    </div>
    <div class="modalBody">
      <div class="tabBar">
        <button class="tabBtn active" onclick="switchTab('tabSummary')">요약</button>
        <button class="tabBtn" onclick="switchTab('tabDong')">행정동별</button>
        <button class="tabBtn" onclick="switchTab('tabAge')">연령별</button>
      </div>
      
      <div id="tabSummary" class="tabPane" style="display:block;">
        <div style="height:300px;"><canvas id="chartType"></canvas></div>
        <table class="miniTable" style="margin-top:20px;">
          <thead><tr><th>구분</th><th>인원</th><th>비율</th><th>비고</th></tr></thead>
          <tbody id="tblSummary"></tbody>
        </table>
      </div>
      
      <div id="tabDong" class="tabPane">
        <table class="miniTable">
          <thead><tr><th>행정동</th><th>신환(1회)</th><th>전환</th><th>90일</th><th>재진</th><th>합계</th></tr></thead>
          <tbody id="tblDong"></tbody>
        </table>
      </div>

      <div id="tabAge" class="tabPane">
        <div style="height:250px;"><canvas id="chartAge"></canvas></div>
        <table class="miniTable" style="margin-top:15px;">
          <thead><tr><th>연령대</th><th>인원</th><th>비율</th></tr></thead>
          <tbody id="tblAge"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast">알림</div>

<script>
// === Constants ===
const WALK_M_PER_MIN = 67;
const BIKE_M_PER_MIN = 250;
const REP_COLOR = { 
  "신환 (1회만)": "#ff0000", 
  "재진 전환": "#00c853", 
  "90일초": "#ffd400", 
  "재진": "#228be6" 
};
const SVG_MARKERS = {
  senior: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23964b00%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E",
  welfare: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23845ef7%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E",
  ortho: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%232b8a3e%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%8F%A5%3C/text%3E%3C/svg%3E"
};

let map, drawingManager, clusterer, geocoder, places;
let roadview, roadviewClient; // Roadview Objects
let roadviewMode = false; // Roadview State

let patients = [];
let targetMarkers = { senior:[], welfare:[], ortho:[] };
let myHospitalMarker = null;

const toggleState = {
  all: true,
  new_only: true,
  new_conv: true,
  bit_90: true,
  old: true
};

const $ = (id) => document.getElementById(id);
const toast = (msg) => { const t=$('toast'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); };

// === Init ===
function initKakao(){
  if(!window.kakao || !kakao.maps) { setTimeout(initKakao, 100); return; }
  kakao.maps.load(() => {

async function processFile(file){
  toast("분석 중...");
  const fr = new FileReader();
  fr.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    let workbook;
    try { workbook = XLSX.read(data, {type:'array'}); } 
    catch { const u = Encoding.convert(data, {to:"UNICODE", from:"AUTO"}); workbook = XLSX.read(Encoding.codeToString(u), {type:'string'}); }
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header:1});
    parsePatients(rows);
  };
  fr.readAsArrayBuffer(file);
}

function calcAge(row, idx) {
  if (idx.age >= 0 && row[idx.age]) {
    const val = String(row[idx.age]);
    const match = val.match(/(\d+)세/);
    if(match) return parseInt(match[1]);
    if(!isNaN(val)) return parseInt(val);
  }
  if (idx.rrn >= 0 && row[idx.rrn]) {
    const rrn = String(row[idx.rrn]).replace(/-/g, '').trim();
    if(rrn.length >= 7) {
      const y2 = parseInt(rrn.substring(0,2));
      const code = rrn.charAt(6);
      let year = (code==='3'||code==='4'||code==='7'||code==='8') ? 2000+y2 : 1900+y2;
      return new Date().getFullYear() - year;
    }
  }
  return 0;
}

function parsePatients(rows){
  let headIdx = -1;
  for(let i=0; i<Math.min(rows.length, 20); i++){ if(JSON.stringify(rows[i]).includes("주소")) { headIdx = i; break; } }
  if(headIdx < 0) return;

  const h = rows[headIdx].map(x => String(x||""));
  const idx = {
    id: h.findIndex(s => /차트|번호|ID/.test(s)),
    addr: h.findIndex(s => /주소/.test(s)),
    name: h.findIndex(s => /이름|성명|수진자|환자/.test(s)), 
    new: h.findIndex(s => /신규|신환/.test(s)),
    type: h.findIndex(s => /구분|분류/.test(s)),
    age: h.findIndex(s => /나이|연령/.test(s)),
    rrn: h.findIndex(s => /주민|주민번호/.test(s))
  };

  const mapData = new Map();
  for(let i=headIdx+1; i<rows.length; i++){
    const r = rows[i];
    if(!r || !r[idx.id]) continue;
    const pid = r[idx.id];
    
    if(!mapData.has(pid)) {
      mapData.set(pid, {
        name: r[idx.name]||"미상", addr: r[idx.addr]||"", age: calcAge(r, idx),
        newV: 0, ret90V: 0, oldV: 0, total: 0
      });
    }
    const p = mapData.get(pid);
    p.total++;

    let isNew = false, is90 = false;
    if(idx.new >= 0 && r[idx.new]) isNew = true;
    else if(idx.type >= 0) {
      const t = String(r[idx.type]||"");
      if(t.includes("90")) is90 = true;
      else if(/신환|신규|1/.test(t)) isNew = true;
    }
    if(isNew) p.newV++; else if(is90) p.ret90V++; else p.oldV++;
  }

  patients = Array.from(mapData.values());
  patients.forEach(p => {
    if(p.newV > 0) {
      if(p.oldV > 0) { p.type = "재진 전환"; p.filterKey = "new_conv"; }
      else { p.type = "신환 (1회만)"; p.filterKey = "new_only"; }
    } else if (p.ret90V > 0) {
      p.type = "90일초"; p.filterKey = "bit_90";
    } else {
      p.type = "재진"; p.filterKey = "old";
    }
  });

  $('statTotalUsers').innerText = patients.length.toLocaleString();

  clusterer.clear();
  patients.forEach((p, i) => {
    setTimeout(() => {
      geocoder.addressSearch(p.addr, (res, status) => {
        if(status === kakao.maps.services.Status.OK){
          const latlng = new kakao.maps.LatLng(res[0].y, res[0].x);
          p.latlng = latlng;
          p.dong = res[0].address?.region_3depth_name || res[0].road_address?.region_3depth_name || "미상";
          
          const color = REP_COLOR[p.type];
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="white" stroke-width="1"/></svg>`;
          const marker = new kakao.maps.Marker({ position: latlng, image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(14,14)) });
          
          const iw = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px;font-size:12px;"><b>${p.name}</b> (${p.age}세)<br><span style="color:${color}">● ${p.type}</span><br>총 ${p.total}회 (신환 ${p.newV} / 재진 ${p.oldV})</div>`,
            removable: true
          });
          kakao.maps.event.addListener(marker, 'click', () => iw.open(map, marker));
          p.marker = marker;
          
          if(toggleState[p.filterKey]) clusterer.addMarker(marker);
        }
        if(i === patients.length - 1) { 
          applyFilter(); 
          $('btnFit').click(); 
          toast("분석 완료"); 
        }
      });
    }, i * 30);
  });
}

function countInCircle(circle) {
  if(!circle) return 0;
  const center = circle.getPosition();
  const radius = circle.getRadius();
  const line = new kakao.maps.Polyline();
  
  let count = 0;
  patients.forEach(p => {
    if(p.marker && p.marker.getMap()) {
      line.setPath([center, p.latlng]);
      if(line.getLength() <= radius) count++;
    }
  });
  return count;
}

function applyFilter(){
  if(!patients.length) return;
  clusterer.clear();
  
  const data = drawingManager.getData();
  const activeCircles = (data.circle || []).map(c => {
    return { center: new kakao.maps.LatLng(c.center.y, c.center.x), radius: c.radius };
  });

  const visibleMarkers = [];
  let visibleCount = 0;

  patients.forEach(p => {
    if(!toggleState[p.filterKey]) return; 

    if(activeCircles.length > 0) {
      let insideAny = false;
      const line = new kakao.maps.Polyline();
      for(const c of activeCircles) {
        line.setPath([c.center, p.latlng]);
        if(line.getLength() <= c.radius) { insideAny = true; break; }
      }
      if(!insideAny) return;
    }

    if(p.marker) {
      visibleMarkers.push(p.marker);
      visibleCount++;
    }
  });

  clusterer.addMarkers(visibleMarkers);
  $('statFilteredUsers').innerText = visibleCount.toLocaleString();
}

kakao.maps.event.addListener(drawingManager, 'state_changed', function(){  applyFilter(); });

function tileBounds(bounds){
  const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  const midLat = (sw.getLat() + ne.getLat()) / 2;
  const midLng = (sw.getLng() + ne.getLng()) / 2;
  return [
    new kakao.maps.LatLngBounds(sw, new kakao.maps.LatLng(midLat, midLng)),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(sw.getLat(), midLng), new kakao.maps.LatLng(midLat, ne.getLng())),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(midLat, sw.getLng()), new kakao.maps.LatLng(ne.getLat(), midLng)),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(midLat, midLng), ne)
  ];
}

async function keywordSearchAllEnhanced(keyword, bounds, depth=0){
  return new Promise((resolve)=>{
    const collected = [];
    places.keywordSearch(keyword, (data, status, pagination)=>{
      if(status===kakao.maps.services.Status.OK){
        collected.push(...data);
        if(pagination.hasNextPage) pagination.nextPage();
        else {
          if(collected.length >= 45 && depth < 2){ 
            Promise.all(tileBounds(bounds).map(b => keywordSearchAllEnhanced(keyword, b, depth+1)))
              .then(results => resolve([...collected, ...results.flat()]));
          } else resolve(collected);
        }
      } else resolve(collected);
    }, { bounds: bounds, useMapBounds: false });
  });
}

  walkMin = '<span class="number">' + walkTime % 60 + '</span>분';
  var bikeTime = distance / 227 | 0;
  var bikeHour = '', bikeMin = '';
  if (bikeTime > 60) bikeHour = '<span class="number">' + Math.floor(bikeTime / 60) + '</span>시간 ';
  bikeMin = '<span class="number">' + bikeTime % 60 + '</span>분';
  return '<ul class="info"><li><span class="label">총거리</span><span class="number">' + distance + '</span>m</li><li><span class="label">도보</span>' + walkHour + walkMin + '</li><li><span class="label">자전거</span>' + bikeHour + bikeMin + '</li></ul>';

    drawingFlag = true;
    centerPosition = mouseEvent.latLng;
    drawingLine = new kakao.maps.Polyline({ strokeWeight: 3, strokeColor: '#228be6', strokeOpacity: 1, strokeStyle: 'solid' });
    drawingCircle = new kakao.maps.Circle({ strokeWeight: 1, strokeColor: '#228be6', strokeOpacity: 0.2, fillColor: '#228be6', fillOpacity: 0.15 });
    drawingOverlay = new kakao.maps.CustomOverlay({ zIndex: 1 });
  }
});

kakao.maps.event.addListener(map, 'mousemove', function(mouseEvent){
  if (!drawingFlag) return;
  var mousePosition = mouseEvent.latLng;
  var linePath = [centerPosition, mousePosition];
  drawingLine.setPath(linePath);
  var length = drawingLine.getLength();
  if (length > 0) {
    drawingCircle.setOptions({ center: centerPosition, radius: length });
    drawingCircle.setMap(map);
    drawingLine.setMap(map);
    drawingOverlay.setPosition(mousePosition);
    drawingOverlay.setContent('<div class="info">반경 <span class="number">' + Math.round(length) + '</span>m</div>');
    drawingOverlay.setMap(map);
  }
});

kakao.maps.event.addListener(map, 'rightclick', function(mouseEvent){
  if (!drawingFlag) return;
  var rClickPosition = mouseEvent.latLng;
  var polyline = new kakao.maps.Polyline({ path: [centerPosition, rClickPosition], strokeWeight: 3, strokeColor: '#228be6', strokeOpacity: 1, strokeStyle: 'solid' });
  var circle = new kakao.maps.Circle({ center: centerPosition, radius: polyline.getLength(), strokeWeight: 1, strokeColor: '#228be6', strokeOpacity: 0.2, fillColor: '#228be6', fillOpacity: 0.15 });
  var radius = Math.round(circle.getRadius());
  var overlay = new kakao.maps.CustomOverlay({ content: getTimeHTML(radius), position: rClickPosition, zIndex: 1 });
  polyline.setMap(map);
  circle.setMap(map);
  overlay.setMap(map);
  circles.push({ circle: circle, polyline: polyline, overlay: overlay });
  drawingFlag = false;
  centerPosition = null;
  drawingCircle.setMap(null);
  drawingLine.setMap(null);
  drawingOverlay.setMap(null);
});

// === Distance Measure ===
var distDrawing = false;
var distLine = null;
var distOverlay = null;

kakao.maps.event.addListener(map, 'click', function(mouseEvent){
  if (!$('btnDist').classList.contains('active')) return;
  if (!distDrawing) {
    distDrawing = true;
    distLine = new kakao.maps.Polyline({ path: [mouseEvent.latLng], strokeWeight: 3, strokeColor: '#fa5252', strokeOpacity: 1, strokeStyle: 'solid' });
    distOverlay = new kakao.maps.CustomOverlay({ zIndex: 1 });
    distLine.setMap(map);
  } else {
    var path = distLine.getPath();
    path.push(mouseEvent.latLng);
    distLine.setPath(path);
  }
});

kakao.maps.event.addListener(map, 'mousemove', function(mouseEvent){
  if (!distDrawing || !distLine) return;
  var path = distLine.getPath();
  if (path.length < 1) return;
  var tempPath = path.concat([mouseEvent.latLng]);
  var tempLine = new kakao.maps.Polyline({ path: tempPath });
  var distance = Math.round(tempLine.getLength());
  distOverlay.setPosition(mouseEvent.latLng);
  distOverlay.setContent('<div class="info">거리 <span class="number">' + distance + '</span>m</div>');
  distOverlay.setMap(map);
});

kakao.maps.event.addListener(map, 'rightclick', function(){
  if (!distDrawing) return;
  distDrawing = false;
  distOverlay = null;
});

// === NEW UI Controller Logic ===
(function __setupControls(){
  function q(id){return document.getElementById(id);}
  function setActive(id, groupSelector){
    if(groupSelector) document.querySelectorAll(groupSelector).forEach(el=>el.classList.remove('active'));
    q(id).classList.add('active');
  }

  function wait(){
    if(!window.kakao || !kakao.maps || !window.map){ return setTimeout(wait, 100); }

    // Map Types
    q('btnMapRoad').onclick = () => { map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP); setActive('btnMapRoad', '.map-type-btn'); };
    q('btnMapSky').onclick = () => { map.setMapTypeId(kakao.maps.MapTypeId.SKYVIEW); setActive('btnMapSky', '.map-type-btn'); };
    q('btnMapTopo').onclick = () => { map.setMapTypeId(kakao.maps.MapTypeId.HYBRID); setActive('btnMapTopo', '.map-type-btn'); };

    // Tools Helper
    function resetTools(){
      document.querySelectorAll('.v-tool-btn').forEach(b => b.classList.remove('active'));
      roadviewMode = false;
      map.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      map.setCursor('auto');
    }

    // Cadastral
    q('btnCadastral').onclick = function(){
      this.classList.toggle('active');
      const on = this.classList.contains('active');
      if(on) map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
      else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
    };

    // Roadview
    q('btnRoadview').onclick = function(){
      resetTools();
      this.classList.add('active');
      roadviewMode = true;
      map.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
      map.setCursor('crosshair');
      toast("지도 위를 클릭하여 로드뷰 보기");
    };

    // Radius
    q('btnRadius').onclick = function(){
      resetTools();
      this.classList.add('active');
      // Handled by existing click event
    };

    // Area
    var areaDrawing=false, areaPath=[], areaPoly=null, areaOverlay=null;
    window.__areaPolys = [];

    q('btnArea').onclick = function(){
      resetTools();
      this.classList.add('active');
    };

    kakao.maps.event.addListener(map,'click',function(me){
      if(!q('btnArea').classList.contains('active')) return;
      if(!areaDrawing){
        areaDrawing=true;
        areaPath=[me.latLng];
        areaPoly=new kakao.maps.Polygon({ path: areaPath, strokeWeight: 2, strokeColor: '#7950f2', strokeOpacity: 0.9, fillColor: '#7950f2', fillOpacity: 0.15 });
        areaPoly.setMap(map);
        areaOverlay=new kakao.maps.CustomOverlay({ zIndex: 2 });
      } else {
        areaPath.push(me.latLng);
        areaPoly.setPath(areaPath);
      }
    });

    kakao.maps.event.addListener(map,'mousemove',function(me){
      if(!areaDrawing || !areaPoly) return;
      var tempPath = areaPath.concat([me.latLng]);
      areaPoly.setPath(tempPath);
      if(tempPath.length>=3){
        var tmp = new kakao.maps.Polygon({ path: tempPath });
        var area = Math.round(tmp.getArea());
        areaOverlay.setPosition(me.latLng);
        areaOverlay.setContent('<div class="info">면적 <span class="number">'+area.toLocaleString()+'</span>㎡</div>');
        areaOverlay.setMap(map);
      }
    });

    kakao.maps.event.addListener(map,'rightclick',function(me){
      if(!q('btnArea').classList.contains('active')) return;
      if(!areaDrawing || areaPath.length<3) { 
        areaDrawing=false; areaPath=[]; if(areaPoly) areaPoly.setMap(null); if(areaOverlay) areaOverlay.setMap(null); 
        return; 
      }
      var poly = new kakao.maps.Polygon({ path: areaPath, strokeWeight: 2, strokeColor: '#7950f2', strokeOpacity: 0.9, fillColor: '#7950f2', fillOpacity: 0.15 });
      poly.setMap(map);
      var area = Math.round(poly.getArea());
      var ov = new kakao.maps.CustomOverlay({ position: me.latLng, content: '<div class="info">면적 <span class="number">'+area.toLocaleString()+'</span>㎡</div>', zIndex: 2 });
      ov.setMap(map);
      window.__areaPolys.push({poly: poly, overlay: ov});
      areaDrawing=false; areaPath=[]; if(areaPoly) areaPoly.setMap(null); if(areaOverlay) areaOverlay.setMap(null);
    });

    // Distance
    q('btnDist').onclick = function(){
      resetTools();
      this.classList.add('active');
    };

    // Traffic/Bike
    q('btnTraffic').onclick = function(){
      this.classList.toggle('active');
      if(this.classList.contains('active')) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
      else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
    };
    q('btnBike').onclick = function(){
      this.classList.toggle('active');
      if(this.classList.contains('active')) map.addOverlayMapTypeId(kakao.maps.MapTypeId.BICYCLE);
      else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.BICYCLE);
    };

    // Clear All
    q('btnClearTools').onclick = function(){
      resetTools();
      // Clear Radius
      circles.forEach(c => { c.circle.setMap(null); c.polyline.setMap(null); c.overlay.setMap(null); });
      circles = [];
      // Clear Area
      if(window.__areaPolys) window.__areaPolys.forEach(a => { a.poly.setMap(null); a.overlay.setMap(null); });
      window.__areaPolys = [];
      // Clear Dist
      if(distLine) distLine.setMap(null);
      if(distOverlay) distOverlay.setMap(null);
      
      // Clear Overlays
      q('btnCadastral').classList.remove('active'); map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT);
      q('btnTraffic').classList.remove('active'); map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
      q('btnBike').classList.remove('active'); map.removeOverlayMapTypeId(kakao.maps.MapTypeId.BICYCLE);
      
      toast("모든 도구 삭제됨");
    };
    
    // Close Roadview
    q('btnCloseRoadview').onclick = function(){
      q('roadviewModal').style.display = 'none';
    };

    // Escape Key
    document.addEventListener('keydown', function(e){
      if(e.key==='Escape') {
        resetTools();
        q('roadviewModal').style.display = 'none';
      }
    });
  }
  wait();
})();
</script>
