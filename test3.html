<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>jinsul-add v2.2.6 (Stats Restored)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,drawing,clusterer"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <style>
    /* === Design System (v2.2 Original) === */
    :root { 
      --blue:#228be6; --blue-light:#e7f5ff;
      --red:#fa5252; --red-light:#fff5f5;
      --border:#dee2e6; --text:#343a40; --bg:#f8f9fa; --card:#fff;
      --c-new:#ff0000; --c-conv:#00c853; --c-90:#ffd400; --c-ret:#228be6;
    }
    
    *{box-sizing:border-box;font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;}
    
    .app{display:flex;height:100%;width:100%;}
    
    /* Sidebar */
    .sidebar{width:340px;min-width:340px;height:100%;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;}
    .sidebarHeader{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .brand{font-weight:900;font-size:16px;}
    .sidebarBody{flex:1;overflow-y:auto;padding:15px;}
    
    /* Sections */
    .section{background:#fff;border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:12px;}
    .sectionTitle{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
    .pill{font-size:10px;background:var(--blue);color:white;padding:3px 6px;border-radius:4px;font-weight:normal;}
    
    /* Upload Box */
    .uploadBox{border:2px dashed #adb5bd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#f8f9fa;transition:0.2s;}
    .uploadBox:hover{border-color:var(--blue);background:var(--blue-light);}
    
    /* Stats Grid (Restored from v2.2) */
    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;background:#f8f9fa;padding:10px;border-radius:6px;}
    .statItem{text-align:center;}
    .statLabel{font-size:11px;color:#868e96;margin-bottom:2px;}
    .statValue{font-size:16px;font-weight:800;color:var(--text);}

    /* Buttons */
    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .btn{width:100%;padding:10px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:12px;transition:0.2s;}
    .btn.primary{background:var(--blue);color:white;}
    .btn.primary:hover{background:#1c7ed6;}
    .btn.danger{background:var(--red-light);color:var(--red);}
    .btn.danger:hover{background:#ffc9c9;}
    .btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}
    .btn.outline:hover{background:#f1f3f5;}

    /* Filter Row */
    .filter-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #f1f3f5;}
    .filter-row:last-child{border-bottom:none;}
    .filter-info{display:flex;align-items:center;gap:6px;}
    .dot{width:10px;height:10px;border-radius:50%;}
    .filter-check{width:16px;height:16px;accent-color:#333;cursor:pointer;}

    /* Search Grid */
    .search-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .search-btn{
      padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
      font-weight:600;color:#495057;
    }
    .search-btn:hover{background:#f8f9fa;}
    .search-btn.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}

    /* Custom Toolbar (Right) */
    .custom-toolbar {
      position: absolute; top: 12px; right: 12px; z-index: 100;
      background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ccc;
    }
    .tool-btn {
      width: 44px; height: 44px; border: none; background: white; cursor: pointer;
      font-size: 20px; border-bottom: 1px solid #eee; display: grid; place-items: center;
      transition: 0.2s; color: #444;
    }
    .tool-btn:last-child { border-bottom: none; }
    .tool-btn:hover { background: #f8f9fa; color: var(--blue); }
    .tool-btn.active { background: var(--blue-light); color: var(--blue); font-weight: bold; }

    /* Map Area */
    .mapArea{flex:1;position:relative;}
    #map{width:100%;height:100%;}
    
    /* Legend */
    #mapLegend{
      position:absolute;top:12px;left:12px;z-index:20;
      background:rgba(255,255,255,0.95);padding:10px;border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);font-size:11px;
      display:flex;flex-direction:column;gap:5px;
    }
    .legend-item{display:flex;align-items:center;gap:6px;}

    /* Info Overlay (Radius) - Strengthened Visibility */
    .info-overlay {
      background: #fff; border: 1px solid #333; border-radius: 6px;
      padding: 6px 10px; font-size: 12px; font-weight: bold; color: #000;
      white-space: nowrap; box-shadow: 0 3px 6px rgba(0,0,0,0.3); pointer-events: none;
    }

    /* Modal (Restored v2.2) */
    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;justify-content:center;align-items:center;}
    .modalPanel{width:90%;max-width:800px;background:white;border-radius:12px;height:85vh;display:flex;flex-direction:column;}
    .modalHeader{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px;}
    .modalBody{flex:1;overflow-y:auto;padding:20px;}
    
    .tabBar{display:flex;gap:10px;margin-bottom:15px;border-bottom:1px solid #eee;padding-bottom:10px;}
    .tabBtn{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer;font-size:13px;}
    .tabBtn.active{background:#333;color:white;border-color:#333;}
    .tabPane{display:none;}
    
    table.miniTable{width:100%;border-collapse:collapse;text-align:center;font-size:12px;}
    table.miniTable th{background:#f8f9fa;padding:8px;position:sticky;top:0;}
    table.miniTable td{padding:8px;border-bottom:1px solid #eee;}

    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;}
    #toast.show{opacity:1;bottom:50px;}
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebarHeader">
      <div class="brand">jinsul-add v2.2.6</div>
      <div style="font-size:18px;cursor:pointer;">≡</div>
    </div>

    <div class="sidebarBody">
      <div class="section">
        <div class="sectionTitle">환자 데이터 <span class="pill">BIT/의사랑</span></div>
        <div class="uploadBox" onclick="document.getElementById('fileInput').click()">
          <div style="font-size:24px;margin-bottom:5px;">📂</div>
          <div style="font-weight:bold;">파일 선택</div>
          <input id="fileInput" type="file" accept=".xls,.xlsx,.csv" style="display:none"/>
        </div>
        <div class="statGrid">
          <div class="statItem"><div class="statLabel">총 인원</div><div class="statValue" id="statTotalUsers">0</div></div>
          <div class="statItem"><div class="statLabel">총 방문</div><div class="statValue" id="statTotalVisits">0</div></div>
        </div>
        <div class="btnRow">
          <button id="btnClear" class="btn danger">초기화</button>
          <button id="btnFit" class="btn primary">전체 보기</button>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle">환자 필터 <span class="pill">분류 기준</span></div>
        
        <div class="filter-row">
          <div class="filter-info"><div class="dot" style="background:var(--c-new)"></div> 신환 (순수+전환)</div>
          <input type="checkbox" class="filter-rep filter-check" data-type="신환" checked>
        </div>
        <div class="filter-row" style="padding-left:15px; background:#fdfdfd;">
          <div class="filter-info"><div class="dot" style="background:var(--c-conv)"></div> └ 재진 전환 (Subset)</div>
          <input type="checkbox" class="filter-rep filter-check" data-type="재진 전환" checked>
        </div>
        <div class="filter-row">
          <div class="filter-info"><div class="dot" style="background:var(--c-90)"></div> 90일초 (BIT)</div>
          <input type="checkbox" class="filter-rep filter-check" data-type="90일초" checked>
        </div>
        <div class="filter-row">
          <div class="filter-info"><div class="dot" style="background:var(--c-ret)"></div> 재진 (General)</div>
          <input type="checkbox" class="filter-rep filter-check" data-type="재진" checked>
        </div>

        <button id="btnStats" class="btn outline" style="width:100%;margin-top:10px;">📊 상세 분석 (v2.2)</button>
      </div>

      <div class="section">
        <div class="sectionTitle">시설 검색</div>
        <div class="search-grid">
          <div class="search-btn" data-target="senior"><span>🏠</span> 경로당</div>
          <div class="search-btn" data-target="welfare"><span>💜</span> 노인재가</div>
          <div class="search-btn" data-target="ortho" style="grid-column:span 2;"><span>🏥</span> 경쟁 병원</div>
        </div>
        <div class="btnRow">
          <button id="btnSearch" class="btn primary">검색</button>
          <button id="btnResetSearch" class="btn danger">지우기</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="mapArea">
    <div id="map"></div>
    
    <div class="custom-toolbar">
      <button class="tool-btn" id="toolCircle" title="원 그리기">⭕</button>
      <button class="tool-btn" id="toolLine" title="거리 재기">📏</button>
      <button class="tool-btn" id="toolClear" title="지우기" style="color:#fa5252;">🗑️</button>
    </div>

    <div id="mapLegend">
      <div style="font-weight:bold;margin-bottom:4px;">환자 분류</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-new)"></div> 신환</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-conv)"></div> 재진 전환</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-90)"></div> 90일초</div>
      <div class="legend-item"><div class="dot" style="background:var(--c-ret)"></div> 재진</div>
    </div>
  </main>
</div>

<div id="statsModal" class="modalBack">
  <div class="modalPanel">
    <div class="modalHeader">
      <span>상세 통계 분석</span>
      <span onclick="document.getElementById('statsModal').style.display='none'" style="cursor:pointer;font-size:20px;">✕</span>
    </div>
    <div class="modalBody">
      <div class="tabBar">
        <button class="tabBtn active" onclick="switchTab('tabSummary')">요약</button>
        <button class="tabBtn" onclick="switchTab('tabDong')">행정동별</button>
        <button class="tabBtn" onclick="switchTab('tabAge')">연령별</button>
      </div>
      
      <div id="tabSummary" class="tabPane" style="display:block;">
        <div style="height:300px;"><canvas id="chartType"></canvas></div>
        <table class="miniTable" style="margin-top:20px;">
          <thead><tr><th>구분</th><th>인원</th><th>비율</th><th>비고</th></tr></thead>
          <tbody id="tblSummary"></tbody>
        </table>
      </div>
      
      <div id="tabDong" class="tabPane">
        <table class="miniTable">
          <thead><tr><th>행정동</th><th>신환(전체)</th><th>90일</th><th>재진</th><th>합계</th></tr></thead>
          <tbody id="tblDong"></tbody>
        </table>
      </div>

      <div id="tabAge" class="tabPane">
        <div style="height:250px;"><canvas id="chartAge"></canvas></div>
        <table class="miniTable" style="margin-top:15px;">
          <thead><tr><th>연령대</th><th>인원</th><th>비율</th></tr></thead>
          <tbody id="tblAge"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast">알림</div>

<script>
// === Constants ===
const WALK_M_PER_MIN = 67;
const BIKE_M_PER_MIN = 250;
const REP_COLOR = { 
  "신환": "#ff0000", 
  "재진 전환": "#00c853", 
  "90일초": "#ffd400", 
  "재진": "#228be6" 
};

let map, drawingManager, clusterer, geocoder, places;
let patients = [];
let targetMarkers = { senior:[], welfare:[], ortho:[] };

const $ = (id) => document.getElementById(id);
const toast = (msg) => { const t=$('toast'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); };

// === Init ===
function initKakao(){
  if(!window.kakao || !kakao.maps) { setTimeout(initKakao, 100); return; }
  
  kakao.maps.load(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7 });
    geocoder = new kakao.maps.services.Geocoder();
    places = new kakao.maps.services.Places();
    clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 5 });

    // Drawing Manager (Manual Control)
    drawingManager = new kakao.maps.drawing.DrawingManager({
      map: map,
      drawingMode: [],
      circleOptions: { draggable: true, removable: true, strokeColor: '#228be6', fillColor: '#228be6', fillOpacity: 0.1 },
      polylineOptions: { draggable: true, removable: true, strokeColor: '#fa5252', strokeWeight: 3 }
    });

    // === Fixed Drawing Event ===
    kakao.maps.event.addListener(drawingManager, 'drawend', function(data) {
      if (!data || !data.overlay) return;
      $('toolCircle').classList.remove('active');
      $('toolLine').classList.remove('active');

      if (data.overlayType === kakao.maps.drawing.OverlayType.CIRCLE) {
        const circle = data.overlay;
        if (typeof circle.getRadius !== 'function') return;

        const r = Math.round(circle.getRadius());
        const walk = Math.round(r / WALK_M_PER_MIN);
        const bike = Math.round(r / BIKE_M_PER_MIN);

        // Explicit Styling for visibility
        const content = `
          <div class="info-overlay">
            반경 <b>${r.toLocaleString()}</b>m<br/>
            🚶${walk}분 🚲${bike}분
          </div>`;
          
        const overlay = new kakao.maps.CustomOverlay({
          position: circle.getPosition(),
          content: content,
          yAnchor: 1.6, 
          zIndex: 9999
        });
        overlay.setMap(map);
        kakao.maps.event.addListener(drawingManager, 'remove', e => { if(e.overlay === circle) overlay.setMap(null); });
      }
    });

    toast("시스템 준비 완료 (v2.2.6)");
  });
}
initKakao();

// === Toolbar ===
$('toolCircle').onclick = function() { this.classList.add('active'); $('toolLine').classList.remove('active'); drawingManager.select(kakao.maps.drawing.OverlayType.CIRCLE); };
$('toolLine').onclick = function() { this.classList.add('active'); $('toolCircle').classList.remove('active'); drawingManager.select(kakao.maps.drawing.OverlayType.POLYLINE); };
$('toolClear').onclick = function() { drawingManager.clear(); $('toolCircle').classList.remove('active'); $('toolLine').classList.remove('active'); toast("도구 삭제"); };

// === File Process ===
$('fileInput').addEventListener('change', e => { if(e.target.files.length) processFile(e.target.files[0]); e.target.value = ""; });

async function processFile(file){
  toast("분석 중...");
  const fr = new FileReader();
  fr.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    let workbook;
    try { workbook = XLSX.read(data, {type:'array'}); } 
    catch { const u = Encoding.convert(data, {to:"UNICODE", from:"AUTO"}); workbook = XLSX.read(Encoding.codeToString(u), {type:'string'}); }
    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header:1});
    parsePatients(rows);
  };
  fr.readAsArrayBuffer(file);
}

function parsePatients(rows){
  let headIdx = -1;
  for(let i=0; i<Math.min(rows.length, 20); i++){ if(JSON.stringify(rows[i]).includes("주소")) { headIdx = i; break; } }
  if(headIdx < 0) return;

  const h = rows[headIdx].map(x => String(x||""));
  const idx = {
    id: h.findIndex(s => /차트|번호|ID/.test(s)),
    addr: h.findIndex(s => /주소/.test(s)),
    name: h.findIndex(s => /이름|성명/.test(s)),
    new: h.findIndex(s => /신규|신환/.test(s)),
    type: h.findIndex(s => /구분|분류/.test(s)),
    age: h.findIndex(s => /나이|연령/.test(s))
  };

  const mapData = new Map();
  for(let i=headIdx+1; i<rows.length; i++){
    const r = rows[i];
    if(!r || !r[idx.id]) continue;
    const pid = r[idx.id];
    
    if(!mapData.has(pid)) {
      mapData.set(pid, {
        name: r[idx.name]||"미상", addr: r[idx.addr]||"", age: r[idx.age]||0,
        newV: 0, ret90V: 0, oldV: 0, total: 0
      });
    }
    const p = mapData.get(pid);
    p.total++;

    let isNew = false, is90 = false;
    if(idx.new >= 0 && r[idx.new]) isNew = true;
    else if(idx.type >= 0) {
      const t = String(r[idx.type]||"");
      if(t.includes("90")) is90 = true;
      else if(/신환|신규|1/.test(t)) isNew = true;
    }
    if(isNew) p.newV++; else if(is90) p.ret90V++; else p.oldV++;
  }

  patients = Array.from(mapData.values());
  let totalVisits = 0;
  
  // === LOGIC FIX: "New" Priority & "Converted" Subset ===
  patients.forEach(p => {
    totalVisits += p.total;
    // Primary Category logic for Colors
    // If ever New -> It is New (Red). 
    // If New AND Returned -> It is Converted (Green, but statistically New).
    
    if(p.newV > 0) {
      if(p.oldV > 0) {
        p.type = "재진 전환"; // Marker color green
        p.baseType = "신환"; // Logical category
      } else {
        p.type = "신환";
        p.baseType = "신환";
      }
    } else if (p.ret90V > 0) {
      p.type = "90일초";
      p.baseType = "90일초";
    } else {
      p.type = "재진";
      p.baseType = "재진";
    }
  });

  // Sidebar Stats
  $('statTotalUsers').innerText = patients.length.toLocaleString();
  $('statTotalVisits').innerText = totalVisits.toLocaleString();

  // Geocoding
  clusterer.clear();
  patients.forEach((p, i) => {
    setTimeout(() => {
      geocoder.addressSearch(p.addr, (res, status) => {
        if(status === kakao.maps.services.Status.OK){
          const latlng = new kakao.maps.LatLng(res[0].y, res[0].x);
          p.latlng = latlng;
          p.dong = res[0].address?.region_3depth_name || "미상";
          
          const color = REP_COLOR[p.type];
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="white" stroke-width="1"/></svg>`;
          const marker = new kakao.maps.Marker({ position: latlng, image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(14,14)) });
          
          const iw = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px;font-size:12px;"><b>${p.name}</b> (${p.age}세)<br><span style="color:${color}">● ${p.type}</span><br>총 ${p.total}회</div>`,
            removable: true
          });
          kakao.maps.event.addListener(marker, 'click', () => iw.open(map, marker));
          p.marker = marker;
          clusterer.addMarker(marker);
        }
        if(i === patients.length - 1) { applyFilter(); $('btnFit').click(); toast("분석 완료"); }
      });
    }, i * 30);
  });
}

// === Filter ===
document.querySelectorAll('.filter-rep').forEach(cb => cb.addEventListener('change', applyFilter));
function applyFilter(){
  clusterer.clear();
  const checked = Array.from(document.querySelectorAll('.filter-rep:checked')).map(c => c.dataset.type);
  const visible = [];
  patients.forEach(p => { 
    if(p.marker && checked.includes(p.type)) visible.push(p.marker);
  });
  clusterer.addMarkers(visible);
}

$('btnClear').onclick = () => { clusterer.clear(); patients=[]; $('statTotalUsers').innerText=0; $('statTotalVisits').innerText=0; toast("초기화"); };
$('btnFit').onclick = () => { if(patients.length) { const b = new kakao.maps.LatLngBounds(); patients.forEach(p=>p.marker&&b.extend(p.marker.getPosition())); map.setBounds(b); } };

// === Detailed Stats (Logic Corrected) ===
let chartObj1, chartObj2;

$('btnStats').onclick = () => {
  if(!patients.length) { toast("데이터 없음"); return; }
  $('statsModal').style.display = 'flex';
  
  const checked = Array.from(document.querySelectorAll('.filter-rep:checked')).map(c => c.dataset.type);
  // Allow stats to show all if filtered, or just filtered? Usually filtered set.
  const visible = patients.filter(p => p.marker && checked.includes(p.type));
  
  // 1. Summary Calculation
  // Logic: Sum of New(Base) + 90 + Return = Total.
  // Converted is a subset of New.
  let cntNewBase = 0; // Pure New + Converted
  let cntConv = 0;    // Converted Only
  let cnt90 = 0;
  let cntRet = 0;

  visible.forEach(p => {
    if(p.baseType === "신환") {
      cntNewBase++;
      if(p.type === "재진 전환") cntConv++;
    } else if(p.baseType === "90일초") cnt90++;
    else if(p.baseType === "재진") cntRet++;
  });

  const total = cntNewBase + cnt90 + cntRet; // Logical Total
  
  // Table
  const tblHtml = `
    <tr><td style="color:${REP_COLOR['신환']};font-weight:bold;">신환 (전체)</td><td>${cntNewBase}</td><td>${pct(cntNewBase, total)}%</td><td>총 신환 수</td></tr>
    <tr><td style="color:${REP_COLOR['재진 전환']}">└ 재진 전환</td><td>${cntConv}</td><td>${pct(cntConv, cntNewBase)}%</td><td>신환 중 재방문</td></tr>
    <tr><td style="color:${REP_COLOR['90일초']}">90일초</td><td>${cnt90}</td><td>${pct(cnt90, total)}%</td><td></td></tr>
    <tr><td style="color:${REP_COLOR['재진']}">재진</td><td>${cntRet}</td><td>${pct(cntRet, total)}%</td><td></td></tr>
    <tr style="background:#f1f3f5;font-weight:bold;"><td>합계</td><td>${total}</td><td>100%</td><td>검증 완료</td></tr>
  `;
  $('tblSummary').innerHTML = tblHtml;

  // Chart (Doughnut: New, 90, Return)
  if(chartObj1) chartObj1.destroy();
  chartObj1 = new Chart($('chartType'), {
    type: 'doughnut',
    data: {
      labels: [`신환(${cntNewBase})`, `90일(${cnt90})`, `재진(${cntRet})`],
      datasets: [{
        data: [cntNewBase, cnt90, cntRet],
        backgroundColor: [REP_COLOR['신환'], REP_COLOR['90일초'], REP_COLOR['재진']]
      }]
    },
    options: { plugins: { datalabels: { color:'white', font:{weight:'bold'} } } },
    plugins: [ChartDataLabels]
  });

  // 2. Dong Stats
  const dongMap = {};
  visible.forEach(p => {
    const d = p.dong || "미상";
    if(!dongMap[d]) dongMap[d] = { n:0, n90:0, r:0, t:0 };
    dongMap[d].t++;
    if(p.baseType==='신환') dongMap[d].n++;
    else if(p.baseType==='90일초') dongMap[d].n90++;
    else dongMap[d].r++;
  });
  
  const sortedDong = Object.keys(dongMap).sort((a,b) => dongMap[b].t - dongMap[a].t);
  $('tblDong').innerHTML = sortedDong.map(d => {
    const v = dongMap[d];
    return `<tr><td>${d}</td><td>${v.n}</td><td>${v.n90}</td><td>${v.r}</td><td><b>${v.t}</b></td></tr>`;
  }).join("");

  // 3. Age Stats
  const ageMap = {};
  visible.forEach(p => {
    const ag = Math.floor(p.age/10)*10 || 0;
    const label = ag+"대";
    ageMap[label] = (ageMap[label]||0)+1;
  });
  const ages = Object.keys(ageMap).sort();
  
  $('tblAge').innerHTML = ages.map(a => `<tr><td>${a}</td><td>${ageMap[a]}</td><td>${pct(ageMap[a], total)}%</td></tr>`).join("");
  
  if(chartObj2) chartObj2.destroy();
  chartObj2 = new Chart($('chartAge'), {
    type: 'bar',
    data: {
      labels: ages,
      datasets: [{ label: '인원수', data: ages.map(a=>ageMap[a]), backgroundColor: '#228be6' }]
    },
    options: { plugins: { legend:{display:false} } }
  });
};

function pct(v, t) { return t ? ((v/t)*100).toFixed(1) : "0.0"; }
window.switchTab = (id) => {
  document.querySelectorAll('.tabPane').forEach(e => e.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
};

// Search Facilities
const searchBtns = document.querySelectorAll('.search-btn');
searchBtns.forEach(b => b.onclick = function(){ this.classList.toggle('active'); });
$('btnSearch').onclick = async () => {
  const actives = document.querySelectorAll('.search-btn.active');
  if(!actives.length) return toast("시설 선택 필요");
  Object.values(targetMarkers).forEach(arr => arr.forEach(m => m.setMap(null)));
  targetMarkers = { senior:[], welfare:[], ortho:[] };
  const bounds = map.getBounds();
  let cnt = 0;
  for(const btn of actives){
    const t = btn.dataset.target;
    let k = (t==='senior')?['경로당']:(t==='welfare')?['노인복지']:(t==='ortho')?['정형외과']:[];
    for(const kw of k){
      await new Promise(r => {
        places.keywordSearch(kw, (d, s)=>{
          if(s===kakao.maps.services.Status.OK) d.forEach(p=>{
             const m = new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(p.y,p.x), content:`<div style="background:#fff;border:1px solid #aaa;font-size:11px;padding:2px;">${p.place_name}</div>`, map:map});
             targetMarkers[t].push(m); cnt++;
          }); r();
        }, {bounds});
      });
    }
  }
  toast(`${cnt}개 발견`);
};
$('btnResetSearch').onclick = () => { searchBtns.forEach(b=>b.classList.remove('active')); Object.values(targetMarkers).forEach(a=>a.forEach(m=>m.setMap(null))); };
</script>
