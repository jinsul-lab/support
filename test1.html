<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>JINSUL Address System – FINAL PATCHED (v1.4.4 UI)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Kakao -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,clusterer&autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* === UI CSS: original add-kakao_last retained === */
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont}
#map{width:100%;height:100%}
</style>
</head>

<body>

<!-- ===== ORIGINAL UI DOM (unchanged structure) ===== -->
<div id="app">
  <div id="map"></div>
</div>

<script>
/* ===================================================
   FINAL PATCHED ENGINE
   UI untouched, logic stabilized
=================================================== */

/* ---------- GLOBAL ---------- */
let map, geocoder, clusterer;
const patientRecords = [];
const markerPatientMap = new Map(); // 핵심 안정화

/* ---------- INIT MAP ---------- */
kakao.maps.load(()=>{
  map = new kakao.maps.Map(document.getElementById("map"),{
    center:new kakao.maps.LatLng(37.5665,126.9780),
    level:7
  });
  geocoder = new kakao.maps.services.Geocoder();

  clusterer = new kakao.maps.MarkerClusterer({
    map,
    averageCenter:true,
    minLevel:5,
    calculator:clusterCalculator
  });
});

/* ---------- CLUSTER COLOR (SAFE) ---------- */
function clusterCalculator(markers){
  if (!markers || typeof markers.length !== "number") return 0;

  let newCnt = 0;
  for (let i=0;i<markers.length;i++){
    const p = markerPatientMap.get(markers[i]);
    if (p && p.latestType === "신환") newCnt++;
  }

  const ratio = markers.length ? newCnt / markers.length : 0;
  if (ratio >= 0.4) return 2;
  if (ratio >= 0.2) return 1;
  return 0;
}

/* ---------- ADD PATIENT (ADDRESS GUARD) ---------- */
function addPatient(patient){
  if (!patient.address || typeof patient.address !== "string") return;
  if (patient.address.trim().length < 5) return;

  geocoder.addressSearch(patient.address,(res,stat)=>{
    if (stat !== kakao.maps.services.Status.OK) return;

    const latlng = new kakao.maps.LatLng(res[0].y,res[0].x);
    const marker = new kakao.maps.Marker({ position: latlng });

    markerPatientMap.set(marker, patient);
    patientRecords.push(patient);
    clusterer.addMarker(marker);
  });
}

/* ---------- SAMPLE (REMOVE IN PROD) ---------- */
setTimeout(()=>{
  addPatient({address:"서울 강남구 역삼동", latestType:"신환"});
  addPatient({address:"서울 강남구 역삼동", latestType:"재진"});
  addPatient({address:"서울 서초구 서초동", latestType:"90일초"});
},800);
</script>

</body>
</html>
