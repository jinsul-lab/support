<!DOCTYPE html>
<html>
<head>
    <title>Kakao Medical Map</title>
    <meta name="viewport" content="initial-scale=1.0">
    <meta charset="utf-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* [디자인 성역] */
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        #controls {
            position: absolute; top: 10px; left: 10px; background: white; padding: 15px;
            border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 1000; width: 320px;
        }
        
        #map { height: 100%; width: 100%; z-index: 1; }
        
        #branding {
            position: absolute; bottom: 30px; left: 10px; background: white; padding: 10px;
            border-radius: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 1000; font-size: 12px; pointer-events: none;
        }

        .status-msg { margin-top: 10px; font-size: 13px; color: #333; }
        .version-tag { position: absolute; top: 5px; left: 5px; font-size: 10px; color: #999; z-index: 2000; }
        
        /* 카카오 인포윈도우 스타일 보정 */
        .wrap_info { padding: 5px; font-size: 12px; }
        .info_title { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .info_addr { color: blue; margin-bottom: 3px; }
        .info_desc { color: #666; }
    </style>
</head>
<body>
    <div class="version-tag">v0.0.0.9 (Kakao-Engine)</div>

    <div id="controls">
        <h3 style="margin:0 0 10px 0;">카카오 의료 지도 (중복 통합)</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" />
        <div id="status" class="status-msg">파일을 선택하면 카카오지도로 변환합니다.</div>
    </div>

    <div id="map"></div>
    
    <div id="branding">
        <strong>Kakao Map Visualizer</strong><br>
        Designed by Architect
    </div>

<div id="status"></div>
<script>
(function(){
  const s = document.createElement('script');
  s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=네JS키&libraries=services&autoload=false";
  s.onload = () => {
    if (!window.kakao) {
      document.getElementById("status").textContent = "SDK는 로드됐지만 kakao 전역이 없습니다(차단/비정상 응답).";
      return;
    }
    kakao.maps.load(() => initMap());
  };
  s.onerror = () => {
    document.getElementById("status").textContent = "Kakao SDK 네트워크 로드 실패(차단/도메인/네트워크).";
  };
  document.head.appendChild(s);
})();
</script>


  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services&autoload=false"></script>
<script>
  kakao.maps.load(() => {
    initMap();
  });
</script>



    <script>
        let map;
        let geocoder;
        // 카카오는 Bounds 객체가 LatLngBounds 입니다.
        let bounds; 

        /* ==========================================================================================
           [입구 전처리 함수] 엑셀 처리 로직 (Google 버전과 동일)
           ========================================================================================== */
        document.getElementById('excelFile').addEventListener('change', handleFileSelect, false);

        function handleFileSelect(evt) {
            const file = evt.target.files[0];
            if (!file) return;
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "데이터 통합 중...";

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                
                // 헤더 찾기
                const rawData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(rawData.length, 30); i++) {
                    const rowStr = rawData[i] ? rawData[i].join("").replace(/\s+/g, "") : "";
                    if (rowStr.includes("주소") || rowStr.includes("Address")) {
                        headerRowIndex = i; break;
                    }
                }

                if (headerRowIndex === -1) {
                    statusDiv.innerHTML = "<span style='color:red;'>오류: '주소' 열을 찾을 수 없습니다.</span>";
                    return;
                }

                const finalJson = XLSX.utils.sheet_to_json(worksheet, {range: headerRowIndex});
                const uniquePatients = mergePatientData(finalJson);
                
                // 지도 초기화 및 마커 표시 시작

                processDataAndMap(uniquePatients);
            };
            reader.readAsArrayBuffer(file);
        }

        // 중복 제거 로직 (Google 버전과 동일)
        function mergePatientData(rawData) {
            const patientMap = {}; 
            rawData.forEach(item => {
                const title = findValueByFuzzyKey(item, ['수진자', '이름', '성명', 'name']);
                const address = findValueByFuzzyKey(item, ['주소', 'addr']);
                const chartNo = findValueByFuzzyKey(item, ['차트', 'no']);
                const age = findValueByFuzzyKey(item, ['나이', 'age']);

                if (!address) return;
                const cleanAddr = address.toString().replace(/\s+/g, '');
                if (cleanAddr === '주소' || cleanAddr === 'Address') return;
                if (title && title.toString().replace(/\s+/g, '') === '수진자명') return;

                const uniqueId = chartNo ? chartNo.toString() : (title + cleanAddr);

                if (patientMap[uniqueId]) {
                    patientMap[uniqueId].visitCount++;
                } else {
                    patientMap[uniqueId] = {
                        title: title, address: address, chartNo: chartNo, age: age, visitCount: 1
                    };
                }
            });
            return Object.values(patientMap);
        }

        function findValueByFuzzyKey(rowObj, keywords) {
            const keys = Object.keys(rowObj);
            for (let target of keywords) {
                for (let key of keys) {
                    const cleanKey = key.replace(/\s+/g, '').toLowerCase(); 
                    if (cleanKey.includes(target)) return rowObj[key];
                }
            }
            return undefined;
        }

        /* ==========================================================================================
           [코드 성역 - Kakao Logic] 
           구글 로직을 폐기하고 카카오 맵 API 로직으로 전면 교체함.
           ========================================================================================== */
        
        function initMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.7381, 127.0337), // 의정부 기준
                level: 7 // 줌 레벨 (숫자가 클수록 멀리 보임)
            };
            map = new kakao.maps.Map(container, options);
            
            // 주소-좌표 변환 객체 생성
            geocoder = new kakao.maps.services.Geocoder();
            
            // 지도 범위 재설정 객체
            bounds = new kakao.maps.LatLngBounds();
            
            // 줌 컨트롤 추가
            const zoomControl = new kakao.maps.ZoomControl();
            map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);
        }

        function processDataAndMap(data) {
            const statusDiv = document.getElementById('status');
            let successCount = 0;
            const totalCount = data.length;

            statusDiv.innerText = `총 ${totalCount}명(통합됨) 주소 검색 시작...`;

            data.forEach((item, index) => {
                // 카카오 주소 검색 (비동기)
                // 카카오는 쿼터 제한이 구글보다 널널하지만, 너무 빠르면 누락될 수 있어 딜레이 유지
                setTimeout(() => {
                    geocoder.addressSearch(item.address, function(result, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            const coords = new kakao.maps.LatLng(result[0].y, result[0].x);

                            // 마커 생성
                            const marker = new kakao.maps.Marker({
                                map: map,
                                position: coords,
                                title: item.title // 마우스 오버 시 나오는 툴팁
                            });

                            // 인포윈도우 내용 (HTML)
                            const content = `
                                <div class="wrap_info" style="padding:5px; background:white; border:1px solid #ccc; min-width:150px;">
                                    <div class="info_title">${item.title} <span style="font-size:11px; font-weight:normal;">(${item.age})</span></div>
                                    <div class="info_addr">${item.address}</div>
                                    <div class="info_desc">방문: <b style="color:red">${item.visitCount}회</b> / 차트: ${item.chartNo}</div>
                                </div>
                            `;

                            // 인포윈도우 객체 (removable: true -> 닫기 버튼 생성)
                            const infowindow = new kakao.maps.InfoWindow({
                                content: content,
                                removable: true
                            });

                            // 마커 클릭 시 인포윈도우 열기
                            kakao.maps.event.addListener(marker, 'click', function() {
                                infowindow.open(map, marker);
                            });

                            // 범위 확장
                            bounds.extend(coords);
                            successCount++;

                            if (successCount % 5 === 0) statusDiv.innerHTML = `진행 중... (성공: ${successCount}명)`;

                            // 마지막 처리 확인
                            if (index >= totalCount - 1) {
                                setTimeout(() => {
                                    if(successCount > 0) map.setBounds(bounds);
                                    statusDiv.innerHTML = `<b style="color:blue">완료!</b> 총 ${successCount}명 표시됨 (카카오)`;
                                }, 1000);
                            }
                        } else {
                            // 주소 검색 실패 시 (콘솔 로그)
                            // console.log("카카오 주소 실패:", item.address);
                        }
                    });
                }, index * 100); // 카카오는 구글보다 빨라서 0.1초 간격도 괜찮음
            });
        }
    </script>
</body>
</html>
