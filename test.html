<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL MAP v2.4.2 (AI Edition)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,drawing,clusterer&autoload=false"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    /* ===========================   DESIGN SANCTUARY (v2.3.6 STYLE)   =========================== */
    :root { 
      --blue:#228be6; --blue-light:#e7f5ff;
      --red:#fa5252; --red-light:#fff5f5;
      --border:#dee2e6; --text:#343a40; --bg:#f8f9fa; --card:#fff;
      --c-new:#ff0000; --c-conv:#00c853; --c-90:#ffd400; --c-ret:#228be6;
      --shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    *{box-sizing:border-box;font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;}
    .app{display:flex;height:100%;width:100%;}

    /* Sidebar - Light Commercial SaaS Override */
    .sidebar {
      width: 360px; min-width: 360px; height: 100%;
      background: radial-gradient(900px 500px at -200px -200px, rgba(59,130,246,0.18), transparent 45%),
                  radial-gradient(700px 400px at 120% 10%, rgba(168,85,247,0.18), transparent 45%), #f6f8fc;
      border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20;
    }
    .sidebarHeader { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
    .brand { font-weight: 900; font-size: 16px; background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sidebarBody { flex: 1; overflow-y: auto; padding: 15px; scrollbar-width: thin; }

    /* Section Card */
    .section {
      background: rgba(255,255,255,0.85); border-radius: 18px; border: 1px solid rgba(0,0,0,0.04);
      backdrop-filter: blur(8px); padding: 15px; margin-bottom: 12px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: all 0.35s cubic-bezier(.4,0,.2,1);
    }
    .sectionTitle { font-weight: 800; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; color: #1f2937; }
    .pill { font-size: 10px; background: var(--blue); color: white; padding: 3px 6px; border-radius: 4px; font-weight: normal; }

    /* Elements */
    .uploadBox { border: 2px dashed #adb5bd; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; background: #f8f9fa; transition: 0.2s; }
    .statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; background: #f8f9fa; padding: 10px; border-radius: 6px; }
    .input-box { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
    .btn { width: 100%; padding: 10px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 12px; transition: 0.2s; text-align: center; }
    .btn.primary { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: white; box-shadow: 0 14px 28px rgba(59,130,246,0.45); }
    .btn.purple { background: linear-gradient(135deg, #8b5cf6, #a78bfa); color: white; box-shadow: 0 18px 36px rgba(139,92,246,0.5); }
    .btn.outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
    
    .search-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .search-btn { padding: 8px 4px; border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 600; font-size: 11px; transition: 0.2s; }
    .search-btn.active { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

    /* Map UI */
    .mapArea { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }
    .mapLegend { position: absolute; top: 12px; left: 12px; z-index: 20; background: rgba(255,255,255,0.95); padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-size: 11px; display: flex; flex-direction: column; gap: 5px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; }

    .map-controls-container { position: absolute; top: 12px; right: 12px; z-index: 150; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .map-type-group { display: flex; background: white; border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #b8b8b8; }
    .map-type-btn { padding: 7px 12px; border: none; background: white; font-size: 12px; font-weight: 600; color: #444; cursor: pointer; border-right: 1px solid #ddd; }
    .map-type-btn.active { background: #228be6; color: white; }
    .vertical-toolbar { width: 44px; background: white; border-radius: 4px; box-shadow: var(--shadow); border: 1px solid #b8b8b8; display: flex; flex-direction: column; overflow: hidden; }
    .v-tool-btn { width: 44px; height: 44px; border: none; background: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 1px solid #eee; transition: 0.1s; }
    .v-tool-btn.active { background: #e7f5ff; color: #228be6; }
    .v-tool-btn span { font-size: 18px; }

    /* AI Advisor Section */
    .ai-section { background: linear-gradient(135deg, #f0f7ff 0%, #ffffff 100%); border: 1px solid #dbeafe; }
    .ai-textarea { width: 100%; border: 1px solid #dbeafe; border-radius: 12px; padding: 10px; font-size: 12px; resize: none; min-height: 70px; margin-bottom: 8px; }
    .ai-response-box { background: #fff; border-radius: 12px; padding: 12px; font-size: 12px; color: #1e3a8a; display: none; margin-top: 10px; max-height: 200px; overflow-y: auto; border: 1px solid #e0f2fe; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }

    /* Modals */
    .modalBack { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; display: none; justify-content: center; align-items: center; }
    .modalPanel { width: 90%; max-width: 800px; background: white; border-radius: 12px; height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
    .modalHeader { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .modalBody { flex: 1; overflow-y: auto; padding: 20px; }
    .tabBar { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .tabBtn { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: white; cursor: pointer; font-size: 13px; }
    .tabBtn.active { background: #333; color: white; border-color: #333; }
    table.miniTable { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
    table.miniTable th { background: #f8f9fa; padding: 8px; position: sticky; top: 0; }
    table.miniTable td { padding: 8px; border-bottom: 1px solid #eee; }

    .info { position: relative; border-radius: 6px; border: 1px solid #ccc; font-size: 12px; padding: 6px 8px; background: #fff; }
    .number { font-weight: bold; color: #00a0e9; }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebarHeader">
      <div class="brand">JINSUL MAP v2.4.2</div>
      <div style="font-size:10px;color:#868e96;">Architect Edition</div>
    </div>
    
    <div class="sidebarBody">
      <!-- 환자 데이터 업로드 -->
      <div class="section">
        <div class="sectionTitle">환자 데이터 업로드 <span class="pill">Excel</span></div>
        <div class="uploadBox" id="uploadBox" onclick="document.getElementById('fileInput').click()">
          📂 환자 엑셀 업로드<br>
          <span style="font-size:11px;color:#868e96;">클릭 또는 파일 드래그</span>
          <input type="file" id="fileInput" hidden accept=".xlsx, .xls, .csv">
        </div>
        <div class="statGrid">
          <div class="statItem"><div style="font-size:10px;color:#888;">총 인원</div><div id="statTotalUsers" style="font-weight:800;font-size:16px;">0</div></div>
          <div class="statItem"><div style="font-size:10px;color:#888;">총 방문</div><div id="statTotalVisits" style="font-weight:800;font-size:16px;">0</div></div>
        </div>
        <div class="btnRow" style="display:flex; gap:5px; margin-top:10px;">
          <button class="btn primary" id="btnStats">📊 통계 분석</button>
          <button class="btn outline" id="btnClear">초기화</button>
        </div>
      </div>

      <!-- 환자 필터 -->
      <div class="section">
        <div class="sectionTitle">환자 필터 <span class="pill">ON/OFF</span></div>
        <div style="display:flex; flex-direction:column; gap:5px;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed #eee;"><span>전체 보기</span><div class="toggle on" data-toggle="all"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed #eee;"><span style="color:var(--c-new)">● 신환(1회)</span><div class="toggle on" data-toggle="new_only"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed #eee;"><span style="color:var(--c-conv)">● 재진전환</span><div class="toggle on" data-toggle="new_conv"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px dashed #eee;"><span style="color:var(--c-90)">● 90일초</span><div class="toggle on" data-toggle="bit_90"></div></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0;"><span style="color:var(--c-ret)">● 재진</span><div class="toggle on" data-toggle="old"></div></div>
        </div>
        <button class="btn outline" id="btnFit" style="margin-top:10px;">지도 범위 최적화</button>
      </div>

      <!-- 시설 검색 -->
      <div class="section">
        <div class="sectionTitle">병원 및 시설 검색</div>
        <div style="display:flex; gap:5px; margin-bottom:10px;">
          <input type="text" class="input-box" id="myHospitalInput" placeholder="우리 병원명/주소 입력">
          <button class="btn primary" id="btnSetHospital" style="width:60px;">설정</button>
        </div>
        <div class="search-grid">
          <div class="search-btn" data-target="senior"><span>🏠</span><span>경로당</span></div>
          <div class="search-btn" data-target="welfare"><span>💜</span><span>복지관</span></div>
          <div class="search-btn" data-target="ortho"><span>🏥</span><span>경쟁병원</span></div>
        </div>
        <div class="btnRow" style="display:flex; gap:5px; margin-top:10px;">
          <button class="btn primary" id="btnSearch">시설 스캔</button>
          <button class="btn outline" id="btnResetSearch">초기화</button>
        </div>
      </div>

      <!-- ✨ AI Advisor -->
      <div class="section ai-section">
        <div class="sectionTitle" style="color:#1e40af">✨ AI 마케팅 어드바이저</div>
        <textarea id="aiPrompt" class="ai-textarea" placeholder="현재 환자 분포를 분석해서 홍보 전략을 세워줘."></textarea>
        <button class="btn primary" id="btnAskAI" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6);">💡 AI 분석 리포트 생성</button>
        <div id="aiResponse" class="ai-response-box"></div>
      </div>

      <!-- 방문 루트 -->
      <div class="section">

        <button class="btn purple" id="btnRouteOpt">🚀 최적 방문 경로 생성</button>
      </div>
    </div>
    
    <div style="padding:10px;text-align:center;font-size:10px;color:#adb5bd;border-top:1px solid #eee; background:#fff;">
      JINSUL MAP v2.4.2<br>© 2024 All Rights Reserved.
    </div>
  </div>

  <div class="mapArea">
    <div id="map"></div>
    <div class="mapLegend">
      <div class="legend-item"><div class="dot" style="background:#ff0000"></div>신환(1회)</div>
      <div class="legend-item"><div class="dot" style="background:#00c853"></div>재진전환</div>
      <div class="legend-item"><div class="dot" style="background:#ffd400"></div>90일초</div>
      <div class="legend-item"><div class="dot" style="background:#228be6"></div>재진</div>
    </div>
    
    <div class="map-controls-container">
      <div class="map-type-group">
        <button class="map-type-btn active" id="btnMapRoad">지도</button>
        <button class="map-type-btn" id="btnMapSky">스카이</button>
      </div>
      <div class="vertical-toolbar">
        <button class="v-tool-btn" id="btnTraffic" title="교통정보"><span>🚦</span></button>
        <button class="v-tool-btn" id="btnCadastral" title="지적편집도"><span>🗺️</span></button>

        <button class="v-tool-btn" id="btnRoadview" title="로드뷰"><span>📷</span></button>

<div id="toast" style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:white;padding:8px 20px;border-radius:20px;font-size:12px;opacity:0;transition:0.3s;z-index:10000;pointer-events:none;">알림</div>

<!-- Modals (Stats, Routes, etc.) -->
<div id="statsModal" class="modalBack">
  <div class="modalPanel">
    <div class="modalHeader">📊 상세 통계 분석 <span style="cursor:pointer;" onclick="closeModal('statsModal')">✕</span></div>
    <div class="modalBody">
      <div class="tabBar">
        <button class="tabBtn active" onclick="switchTab('tabType')">유형별</button>
        <button class="tabBtn" onclick="switchTab('tabAge')">연령별</button>
        <button class="tabBtn" onclick="switchTab('tabVisit')">방문수</button>
      </div>
      <div id="tabType" class="tabPane" style="display:block;">
        <div style="display:flex; gap:20px; align-items:center;">
          <div style="flex:1;"><table class="miniTable"><thead><tr><th>구분</th><th>인원</th><th>비율</th></tr></thead><tbody id="tblSummary"></tbody></table></div>
          <div style="width:250px; height:250px;"><canvas id="chartType"></canvas></div>
        </div>
      </div>
      <div id="tabAge" class="tabPane" style="display:none;">
        <canvas id="chartAge" style="max-height:300px;"></canvas>
      </div>
      <div id="tabVisit" class="tabPane" style="display:none;">
        <canvas id="chartVisit" style="max-height:300px;"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const apiKey = "";
const WALK_SPEED = 67; const BIKE_SPEED = 227;
let map, clusterer, geocoder, places, drawingManager;
let patients = [], searchedData = [], myHospitalMarker = null;
const REP_COLOR = { "신환 (1회만)": "#ff0000", "신환 ▶ 재진 전환": "#00c853", "90일초": "#ffd400", "재진": "#228be6" };
const toggleState = { all: true, new_only: true, new_conv: true, bit_90: true, old: true };

const $ = (id) => document.getElementById(id);
const toast = (msg) => { const t=$('toast'); t.innerText=msg; t.style.opacity=1; setTimeout(()=>t.style.opacity=0, 2000); };
const closeModal = (id) => $(id).style.display = 'none';

// 1. 카카오맵 초기화 (autoload=false 대응)
function initKakao() {
    if (typeof kakao === 'undefined' || !kakao.maps) {
        setTimeout(initKakao, 100);
        return;
    }
    kakao.maps.load(() => {
        const container = $('map');
        const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7 };
        map = new kakao.maps.Map(container, options);
        geocoder = new kakao.maps.services.Geocoder();
        places = new kakao.maps.services.Places();
        clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 5 });
        
        drawingManager = new kakao.maps.drawing.DrawingManager({
            map: map, drawingMode: [],
            circleOptions: { draggable: true, removable: true, strokeColor: '#228be6', fillColor: '#228be6', fillOpacity: 0.1 }
        });
        
        toast("시스템 준비 완료 (v2.4.2)");
    });
}
window.onload = initKakao;

// 2. 엑셀 업로드 및 전처리 (입구 필터)
function processFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
        parsePatients(rows);
    };
    reader.readAsArrayBuffer(file);
}

function parsePatients(rows) {
    // [입구 해결] 약품명 제외 필터
    const filteredRows = rows.filter(row => !JSON.stringify(row).includes("약품"));
    let headIdx = filteredRows.findIndex(r => JSON.stringify(r).includes("주소"));
    if (headIdx < 0) return toast("주소 컬럼을 찾을 수 없습니다.");
    
    patients = [];
    const idx = { id: 0, addr: 1, name: 2, type: 3 }; // 간소화된 인덱스
    
    for(let i=headIdx+1; i<filteredRows.length; i++) {
        const r = filteredRows[i];
        if(!r[0] || !r[1]) continue;
        const type = r[3] || "재진";
        patients.push({ id: r[0], addr: r[1], name: r[2] || "환자", type: type, total: 1 });
    }
    renderMarkers();
}

function renderMarkers() {
    clusterer.clear();
    patients.forEach((p, i) => {
        geocoder.addressSearch(p.addr, (res, status) => {
            if(status === kakao.maps.services.Status.OK) {
                const latlng = new kakao.maps.LatLng(res[0].y, res[0].x);
                p.latlng = latlng;
                const color = REP_COLOR[p.type] || "#888";
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="6" fill="${color}" stroke="white" stroke-width="1"/></svg>`;
                p.marker = new kakao.maps.Marker({ position: latlng, image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(14,14)) });
                clusterer.addMarker(p.marker);
            }
            if(i === patients.length - 1) {
                $('statTotalUsers').innerText = patients.length;
                toast("데이터 로드 완료");
            }
        });
    });
}

// 3. ✨ Gemini AI 어드바이저
$('btnAskAI').onclick = async () => {
    const userPrompt = $('aiPrompt').value.trim();
    const responseBox = $('aiResponse');
    if (!userPrompt) return toast("질문을 입력해주세요.");
    if (patients.length === 0) return toast("먼저 환자 데이터를 업로드해주세요.");

    responseBox.style.display = 'block';
    responseBox.innerHTML = 'AI 분석 리포트 생성 중...';

    const context = `총 환자: ${patients.length}명, 유형: ${JSON.stringify(patients.slice(0,10).map(p=>p.type))}`;
    const systemInstruction = "당신은 병원 마케팅 전문가입니다. 지도 위 환자 분포 데이터를 보고 설계자에게 3줄 요약 마케팅 전략을 제시하세요.";

    try {
        const result = await callGeminiAPI(userPrompt + "\n\n데이터 현황: " + context, systemInstruction);
        responseBox.innerText = result;
    } catch (err) {
        responseBox.innerText = "분석 오류: " + err.message;
    }
};

async function callGeminiAPI(query, systemInstruction, retries = 0) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
    const payload = {
        contents: [{ parts: [{ text: query }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
    };
    try {
        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!response.ok) throw new Error("API Failure");
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "결과 없음";
    } catch (error) {
        if (retries < 3) return callGeminiAPI(query, systemInstruction, retries + 1);
        throw error;
    }
}

// 4. 지도 제어 및 도구
$('btnMapRoad').onclick = () => { map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP); $('btnMapRoad').classList.add('active'); $('btnMapSky').classList.remove('active'); };
$('btnMapSky').onclick = () => { map.setMapTypeId(kakao.maps.MapTypeId.HYBRID); $('btnMapSky').classList.add('active'); $('btnMapRoad').classList.remove('active'); };
$('btnFit').onclick = () => { if(patients.length) { const b = new kakao.maps.LatLngBounds(); patients.forEach(p => p.latlng && b.extend(p.latlng)); map.setBounds(b); } };

$('btnTraffic').onclick = function() { this.classList.toggle('active'); if(this.classList.contains('active')) map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); };
$('btnCadastral').onclick = function() { this.classList.toggle('active'); if(this.classList.contains('active')) map.addOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT); else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.USE_DISTRICT); };

['btnRadius', 'btnDist', 'btnArea', 'btnPoint', 'btnRoadview'].forEach(id => {
    $(id).onclick = function() {
        document.querySelectorAll('.v-tool-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        drawingManager.cancel();
        if(id === 'btnRadius') drawingManager.select(kakao.maps.drawing.OverlayType.CIRCLE);
        if(id === 'btnDist') drawingManager.select(kakao.maps.drawing.OverlayType.POLYLINE);
        if(id === 'btnArea') drawingManager.select(kakao.maps.drawing.OverlayType.POLYGON);
        toast(this.title + " 모드 활성화");
    };
});

$('btnClearTools').onclick = () => {
    drawingManager.cancel();
    document.querySelectorAll('.v-tool-btn').forEach(b => b.classList.remove('active'));
    toast("도구 및 측정값 초기화");
};

$('fileInput').onchange = (e) => processFile(e.target.files[0]);

// 필터 토글 로직
document.querySelectorAll('.toggle').forEach(t => {
    t.onclick = function() {
        const k = this.dataset.toggle;
        this.classList.toggle('on');
        toast("필터 변경됨: " + k);
    };
});

function switchTab(id) {
    document.querySelectorAll('.tabPane').forEach(p => p.style.display = 'none');
    $(id).style.display = 'block';
    document.querySelectorAll('.tabBtn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
}

$('btnStats').onclick = () => {
    if(!patients.length) return toast("데이터가 없습니다.");
    $('statsModal').style.display = 'flex';
    // 통계 차트 로직 (생략 - 필요시 추가 가능)
};
</script>
