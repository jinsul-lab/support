  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,clusterer">
/* === v2.3.8 분류 로직 교체 === */
function classifyBit(visits){
  // 1) 90일초진이 있으면 사람 분류는 '90일초진'으로 고정
  const has90 = visits.some(v => /90일초진/.test(v.flag));
  if (has90) return '90일초진';

  // 2) 일반 신환/재진 로직
  const hasNew = visits.some(v => /신환/.test(v.flag));
  const hasOld = visits.some(v => /재진/.test(v.flag));
  if (!hasNew && !hasOld) return '';

  if (hasNew && hasOld){
    const firstNew = visits
      .filter(v => /신환/.test(v.flag) && v.date)
      .reduce((min, v) => (min===null || v.date < min ? v.date : min), null);

    if (firstNew){
      const oldAfter = visits.some(v => /재진/.test(v.flag) && v.date && v.date > firstNew);
      if (oldAfter) return '신환 ▶ 재진 전환';
      return '신환';
    }
    return '신환';
  }

  if (hasNew) return '신환';
  return '재진';
}

function classifyDoctor(rowsForPid){
  let seenNew = false;
  for (const r of rowsForPid){
    if (r.isNew) seenNew = true;
    else if (seenNew && r.isBlank) return '신환 ▶ 재진 전환';
  }
  if (seenNew) return '신환';
  return '재진';
}
/* === v2.3.8 분류 로직 끝 === */

  <style>
    body{margin:0;font-family:system-ui,sans-serif;font-size:13px}
    .wrap{display:flex;height:100vh}
    .left{width:360px;border-right:1px solid #ddd;padding:10px;box-sizing:border-box}
    .right{flex:1}
    #map{width:100%;height:100%}
    .btn{padding:8px 10px;border:1px solid #ccc;border-radius:6px;cursor:pointer;margin-right:5px}

    .stat{margin-top:10px;font-weight:700}

<body>
<div class="wrap">
  <div class="left">
    <div class="row">
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="right">
    <div id="map"></div>
  </div>
</div>

<script>
/*
수정 요약
1) 차트번호 퍼센타일 기반 90일초진 '환자 분류' 제거
2) 환자 최종 분류: 신환 / 재진 / 신환▶재진 전환
3) 90일초진은 '비트(방문)' 단위로만 카운트
4) 환자 표시: '차트번호 이름'
*/

let map, clusterer, geocoder;
let patients = [];

function initMap(){
  kakao.maps.load(()=>{
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665,126.9780), level:7
    });
    clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter:true, minLevel:5 });
    geocoder = new kakao.maps.services.Geocoder();
  });
}
initMap();

document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    parsePatients(rows);
  };
  r.readAsArrayBuffer(f);
});

function parsePatients(rows){
  // 유틸: 셀을 문자열로
  const s = (x)=>String(x==null?'':x).trim();

  // 유틸: 날짜 파싱(비트)
  const parseDate = (x)=>{
    if(x==null || x==='') return null;
    // SheetJS가 Date 객체/숫자(serial)/문자열로 줄 수 있음
    if(x instanceof Date) return x;
    if(typeof x === 'number'){
      // Excel serial -> JS Date (Excel epoch 1899-12-30)
      const utc = Math.round((x - 25569) * 86400 * 1000);
      return new Date(utc);
    }
    const str = s(x);
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  };

  // 헤더 행 판별: 차트번호가 있고, 초재진구분(비트) 또는 신규환자(의사랑) 중 하나가 있음
  const isHeaderRow = (row)=>{
    const joined = row.map(s).join(' ');
    return /차트번호/.test(joined) && (/(초재진|초재진구분)/.test(joined) || /신규환자/.test(joined));
  };

  // 인덱스 추출
  const buildIdx = (headerRow)=>{
    const h = headerRow.map(s);
    return {
      id: h.findIndex(v=>/차트/.test(v)),
      name: h.findIndex(v=>/이름|성명|수진자명/.test(v)),
      addr: h.findIndex(v=>/주소/.test(v)),
      bit: h.findIndex(v=>/(초재진|초재진구분)/.test(v)),
      date: h.findIndex(v=>/내원날짜|내원일|진료일/.test(v)),
      docNew: h.findIndex(v=>/신규환자/.test(v))
    };
  };

  // 1) 첫 헤더 찾기 (파일 초반 뿐 아니라 중간에 헤더가 다시 나올 수 있음)
  let idx = null;
  let mode = null; // 'bit' | 'doctor'
  for(let i=0;i<rows.length;i++){
    if(isHeaderRow(rows[i])){
      idx = buildIdx(rows[i]);
      mode = idx.bit >= 0 ? 'bit' : 'doctor';
      break;
    }
  }
  if(!idx || !mode){
    alert('헤더(차트번호 + 초재진구분/신규환자)를 찾지 못했습니다');
    return;
  }

  // 2) 데이터 누적 (차트번호 단위)
  const mapData = new Map();

  // 통계용(내원 수)
  let visitCountByType = new Map(); // type -> visits
  let personCountByType = new Map(); // type -> persons
  const addCount = (m,k,delta)=>m.set(k,(m.get(k)||0)+delta);

  // 비트: 90일초진 방문 수(행 단위)
  let bit90Visits = 0;

  // 헤더가 중간에 다시 나오면 인덱스 갱신
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    if(!r) continue;

    if(isHeaderRow(r)){
      const newIdx = buildIdx(r);
      // 같은 파일 내에서 모드가 바뀌는 경우는 없다고 했지만, 안전하게:
      if(newIdx.bit >= 0) mode = 'bit';
      else if(newIdx.docNew >= 0) mode = 'doctor';
      idx = newIdx;
      continue; // 헤더 행은 데이터 아님
    }

    // 차트번호가 없으면 스킵
    const pidRaw = idx.id >= 0 ? r[idx.id] : null;
    const pid = s(pidRaw);
    if(!pid || /차트번호/.test(pid)) continue;

    if(!mapData.has(pid)){
      mapData.set(pid,{
        id: pid,
        name: idx.name>=0 ? s(r[idx.name]) : '',
        addr: idx.addr>=0 ? s(r[idx.addr]) : '',
        visits: [],
        // 공통 플래그
        has90: false,
        // 비트용
        bitHasNew: false,
        bitHasOld: false,
        bitFirstNewDate: null,
        bitHasOldAfterNew: false,
        // 의사랑용
        docSeenNew: false,
        docHasBlankAfterNew: false
      });
    }

    const p = mapData.get(pid);

    if(mode === 'bit'){
      const flag = idx.bit>=0 ? s(r[idx.bit]) : '';
      const dt = idx.date>=0 ? parseDate(r[idx.date]) : null;

      // 방문 저장
      p.visits.push({flag, date: dt});

      // 90일초진 방문(행) 카운트 + 사람 플래그
      if(/90일초진/.test(flag)){
        bit90Visits++;
        p.has90 = true;
      }

      // 신환/재진 플래그 및 "최초 신환 이후 재진" 판정용
      if(/신환/.test(flag)){
        p.bitHasNew = true;
        if(dt && (!p.bitFirstNewDate || dt < p.bitFirstNewDate)) p.bitFirstNewDate = dt;
      }
      if(/재진/.test(flag)){
        p.bitHasOld = true;
        if(p.bitFirstNewDate && dt && dt > p.bitFirstNewDate) p.bitHasOldAfterNew = true;
      }

    } else { // doctor
      const newCell = idx.docNew>=0 ? s(r[idx.docNew]) : '';
      const isNew = /신규/.test(newCell);
      const isBlank = (newCell === '');

      // 방문 저장(의사랑은 날짜 없이 순서가 의미)
      p.visits.push({isNew, isBlank});

      if(isNew) p.docSeenNew = true;
      else if(p.docSeenNew && isBlank) p.docHasBlankAfterNew = true;
    }
  }

  // 3) 사람 분류 + 통계 집계
  patients = Array.from(mapData.values()).map(p=>{
    const totalVisits = p.visits.length;
    let type = '';

    if(mode === 'bit'){
      if(p.has90){
        type = '90일초';
      } else if(p.bitHasNew && p.bitHasOld && p.bitHasOldAfterNew){
        type = '신환 ▶ 재진';
      } else if(p.bitHasNew){
        type = (totalVisits === 1) ? '신환(1회만)' : '신환';
      } else if(p.bitHasOld){
        type = '재진';
      } else {
        type = ''; // 강제 분류 금지
      }
    } else { // doctor
      if(p.docSeenNew && p.docHasBlankAfterNew){
        type = '신환 ▶ 재진';
      } else if(p.docSeenNew){
        type = (totalVisits === 1) ? '신환(1회만)' : '신환';
      } else {
        type = '재진';
      }
    }

    p.total = totalVisits;
    p.type = type;

    // 사람/내원 통계 (빈칸 분류는 집계 제외)
    if(type){
      addCount(personCountByType, type, 1);
      addCount(visitCountByType, type, totalVisits);
    }
    return p;
  });

  // 4) 통계 표시
  const get = (m,k)=>m.get(k)||0;
  const totalPeople = patients.filter(p=>p.type).length;
  const totalVisits = Array.from(visitCountByType.values()).reduce((a,b)=>a+b,0);

  const newPeople = get(personCountByType,'신환') + get(personCountByType,'신환(1회만)') + get(personCountByType,'신환 ▶ 재진');
  const newVisits  = get(visitCountByType,'신환') + get(visitCountByType,'신환(1회만)') + get(visitCountByType,'신환 ▶ 재진');

  let statLines = [];
  statLines.push(`모드: ${mode === 'bit' ? '비트' : '의사랑'}`);
  statLines.push(`집계 대상(분류 있는 환자): ${totalPeople}명 / 내원 ${totalVisits}회`);
  statLines.push(`총 신환(신환+전환): ${newPeople}명 / 내원 ${newVisits}회`);
  statLines.push(`- 신환(1회만): ${get(personCountByType,'신환(1회만)')}명 / 내원 ${get(visitCountByType,'신환(1회만)')}회`);
  statLines.push(`- 신환: ${get(personCountByType,'신환')}명 / 내원 ${get(visitCountByType,'신환')}회`);
  statLines.push(`- 신환 ▶ 재진: ${get(personCountByType,'신환 ▶ 재진')}명 / 내원 ${get(visitCountByType,'신환 ▶ 재진')}회`);
  statLines.push(`- 재진: ${get(personCountByType,'재진')}명 / 내원 ${get(visitCountByType,'재진')}회`);
  if(mode === 'bit'){
    statLines.push(`- 90일초: ${get(personCountByType,'90일초')}명 / 내원 ${get(visitCountByType,'90일초')}회 (90일초진 방문행 ${bit90Visits}건)`);
  }

  document.getElementById('stat').innerText = statLines.join('\n');

  // 5) 지도 갱신
  drawMarkers();
}


function drawMarkers(){
  clusterer.clear();
  patients.forEach(p=>{
    if(!p.addr) return;
    geocoder.addressSearch(p.addr,(res,st)=>{
      if(st!==kakao.maps.services.Status.OK) return;
      const latlng=new kakao.maps.LatLng(res[0].y,res[0].x);
      const marker=new kakao.maps.Marker({position:latlng});
      const iw=new kakao.maps.InfoWindow({
        content:`<div style="padding:6px"><b>${p.id} ${p.name}</b><br/>${p.type}<br/>내원 ${p.total}회</div>`
      });
      kakao.maps.event.addListener(marker,'click',()=>iw.open(map,marker));
      clusterer.addMarker(marker);
    });
  });
}

/* === v2.3.8 분류 로직 교체 === */
function classifyBit(visits){
  // 1) 90일초진이 있으면 사람 분류는 '90일초진'으로 고정
  const has90 = visits.some(v => /90일초진/.test(v.flag));
  if (has90) return '90일초진';

  // 2) 일반 신환/재진 로직
  const hasNew = visits.some(v => /신환/.test(v.flag));
  const hasOld = visits.some(v => /재진/.test(v.flag));
  if (!hasNew && !hasOld) return '';

  if (hasNew && hasOld){
    const firstNew = visits
      .filter(v => /신환/.test(v.flag) && v.date)
      .reduce((min, v) => (min===null || v.date < min ? v.date : min), null);

    if (firstNew){
      const oldAfter = visits.some(v => /재진/.test(v.flag) && v.date && v.date > firstNew);
      if (oldAfter) return '신환 ▶ 재진 전환';
      return '신환';
    }
    return '신환';
  }

  if (hasNew) return '신환';
  return '재진';
}

function classifyDoctor(rowsForPid){
  let seenNew = false;
  for (const r of rowsForPid){
    if (r.isNew) seenNew = true;
    else if (seenNew && r.isBlank) return '신환 ▶ 재진 전환';
  }
  if (seenNew) return '신환';
  return '재진';
}
/* === v2.3.8 분류 로직 끝 === */

</script>
</body>
