<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL MAP v2.3.8 (입구 필터 강화)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,clusterer"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;font-size:13px;line-height:1.4}
    .wrap{display:flex;height:100vh}
    .left{width:380px;border-right:1px solid #ddd;padding:15px;box-sizing:border-box;display:flex;flex-direction:column}
    .right{flex:1}
    #map{width:100%;height:100%}
    .row{margin-bottom:15px}
    .stat-card{background:#f8f9fa;padding:12px;border-radius:8px;border:1px solid #eee;font-size:12px}
    .stat-title{font-weight:700;margin-bottom:8px;color:#333;display:block;border-bottom:1px solid #ddd;padding-bottom:4px}
    .stat-line{display:flex;justify-content:space-between;margin-bottom:4px}
    .ver{font-size:10px;color:#999;margin-bottom:5px}
    .footer{margin-top:auto;font-size:11px;color:#bbb;text-align:center;padding-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="ver">v2.3.8</div>
    <div class="row">
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </div>
    <div id="statArea" style="display:none">
        <div class="stat-card">
            <span class="stat-title" id="fileTypeDisp">파일 분석 결과</span>
            <div class="stat-line"><span>신환 (순수 + 전환)</span><b id="totalNew">0명</b></div>
            <div style="padding-left:10px; color:#666; margin-bottom:8px">
                <div class="stat-line"><span>- 순수 신환</span><span id="pureNew">0명</span></div>
                <div class="stat-line"><span>- 신환▶재진 전환</span><span id="convNew">0명</span></div>
            </div>
            <div class="stat-line"><span>90일초진</span><b id="bit90">0명</b></div>
            <div class="stat-line"><span>순수 재진</span><b id="onlyOld">0명</b></div>
            <hr style="border:0; border-top:1px dashed #ccc">
            <div class="stat-line" style="margin-top:8px"><span>총 환자 수</span><b id="totalPat">0명</b></div>
            <div class="stat-line"><span>총 내원 횟수</span><b id="totalVisits">0건</b></div>
        </div>
    </div>
    <div class="footer">© 2024 JINSUL MAP. All Rights Reserved.</div>
  </div>
  <div class="right">
    <div id="map"></div>
  </div>
</div>

<script>
let map, clusterer, geocoder;
let patients = [];

function initMap(){
  kakao.maps.load(()=>{
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665,126.9780), level:7
    });
    clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter:true, minLevel:5 });
    geocoder = new kakao.maps.services.Geocoder();
  });
}
initMap();

document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    parsePatients(rows);
  };
  r.readAsArrayBuffer(f);
});

function parsePatients(rows){
  let hIdx=-1;
  for(let i=0;i<Math.min(rows.length,50);i++){
    if(JSON.stringify(rows[i]).includes('주소')){hIdx=i;break;}
  }
  if(hIdx<0){alert('헤더(주소)를 찾지 못했습니다');return;}
  
  const h=rows[hIdx].map(x=>String(x||''));
  const isBit = h.some(s=>/초재진/.test(s));
  
  const idx={
    id: h.findIndex(s=>/차트/.test(s)),
    name: h.findIndex(s=>/이름|성명/.test(s)),
    addr: h.findIndex(s=>/주소/.test(s)),
    typeCol: h.findIndex(s=>/초재진|구분|비고/.test(s))
  };

  const mapData=new Map();
  let totalVCount = 0;

  for(let i=hIdx+1;i<rows.length;i++){
    const r=rows[i];
    if(!r || !r[idx.id] || isNaN(r[idx.id])) continue; // 차트번호가 없는 행(헤더 반복 등) 제외

    const pid=String(r[idx.id]);
    const val=String(r[idx.typeCol]||'').trim();

    if(!mapData.has(pid)){
      mapData.set(pid,{
        id:pid, 
        name:r[idx.name]||'미상', 
        addr:r[idx.addr]||'', 
        rawTypes:[], 
        vCount:0
      });
    }
    const p=mapData.get(pid);
    p.rawTypes.push(val);
    p.vCount++;
    totalVCount++;
  }

  let sPureNew=0, sConvNew=0, s90=0, sOld=0;

  patients=Array.from(mapData.values()).map(p=>{
    if(isBit){
        // --- 비트 로직 ---
        if(p.rawTypes.some(v=>v.includes('90'))){
            p.type='90일초'; s90++;
        } else if(p.rawTypes.includes('신환')){
            if(p.rawTypes.includes('재진')){ p.type='신환 ▶ 재진'; sConvNew++; }
            else { p.type='신환'; sPureNew++; }
        } else {
            p.type='재진'; sOld++;
        }
    } else {
        // --- 의사랑 로직 ---
        const hasNewSign = p.rawTypes.some(v=>v.includes('신규'));
        const hasEmptySign = p.rawTypes.some(v=>v === '');
        
        if(hasNewSign){
            if(hasEmptySign){ p.type='신환 ▶ 재진'; sConvNew++; }
            else { p.type='신환'; sPureNew++; }
        } else {
            p.type='재진'; sOld++;
        }
    }
    return p;
  });

  // UI 업데이트
  document.getElementById('statArea').style.display='block';
  document.getElementById('fileTypeDisp').innerText = isBit ? "파일 분석: 비트 방식" : "파일 분석: 의사랑 방식";
  document.getElementById('totalNew').innerText = (sPureNew + sConvNew) + "명";
  document.getElementById('pureNew').innerText = sPureNew + "명";
  document.getElementById('convNew').innerText = sConvNew + "명";
  document.getElementById('bit90').innerText = s90 + "명";
  document.getElementById('onlyOld').innerText = sOld + "명";
  document.getElementById('totalPat').innerText = patients.length + "명";
  document.getElementById('totalVisits').innerText = totalVCount + "건";

  drawMarkers();
}

function drawMarkers(){
  clusterer.clear();
  patients.forEach(p=>{
    if(!p.addr) return;
    geocoder.addressSearch(p.addr,(res,st)=>{
      if(st!==kakao.maps.services.Status.OK) return;
      const latlng=new kakao.maps.LatLng(res[0].y,res[0].x);
      const marker=new kakao.maps.Marker({position:latlng});
      const iw=new kakao.maps.InfoWindow({
        content:`<div style="padding:10px; min-width:150px">
                  <small style="color:#999">${p.id}</small><br/>
                  <b>${p.name}</b> [${p.type}]<br/>
                  <div style="border-top:1px solid #eee; margin-top:5px; padding-top:5px">내원: ${p.vCount}회</div>
                 </div>`
      });
      kakao.maps.event.addListener(marker,'click',()=>iw.open(map,marker));
      clusterer.addMarker(marker);
    });
  });
}
</script>
</body>
</html>
