<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL MAP v2.3.7 (분류 정상화)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,clusterer"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;font-size:13px}
    .wrap{display:flex;height:100vh}
    .left{width:360px;border-right:1px solid #ddd;padding:10px;box-sizing:border-box}
    .right{flex:1}
    #map{width:100%;height:100%}
    .btn{padding:8px 10px;border:1px solid #ccc;border-radius:6px;cursor:pointer;margin-right:5px}
    .row{margin-bottom:8px}
    .stat{margin-top:10px;font-weight:700}
  </style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="row">
      <input type="file" id="fileInput" accept=".xlsx,.xls" />
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="right">
    <div id="map"></div>
  </div>
</div>

<script>
/*
수정 요약
1) 차트번호 퍼센타일 기반 90일초진 '환자 분류' 제거
2) 환자 최종 분류: 신환 / 재진 / 신환▶재진 전환
3) 90일초진은 '비트(방문)' 단위로만 카운트
4) 환자 표시: '차트번호 이름'
*/

let map, clusterer, geocoder;
let patients = [];

function initMap(){
  kakao.maps.load(()=>{
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(37.5665,126.9780), level:7
    });
    clusterer = new kakao.maps.MarkerClusterer({ map, averageCenter:true, minLevel:5 });
    geocoder = new kakao.maps.services.Geocoder();
  });
}
initMap();

document.getElementById('fileInput').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
    parsePatients(rows);
  };
  r.readAsArrayBuffer(f);
});

function parsePatients(rows){
  let hIdx=-1;
  for(let i=0;i<Math.min(rows.length,20);i++){
    if(JSON.stringify(rows[i]).includes('주소')){hIdx=i;break;}
  }
  if(hIdx<0){alert('헤더를 찾지 못했습니다');return;}
  const h=rows[hIdx].map(x=>String(x||''));
  const idx={
    id: h.findIndex(s=>/차트/.test(s)),
    name: h.findIndex(s=>/이름|성명/.test(s)),
    addr: h.findIndex(s=>/주소/.test(s)),
    bit: h.findIndex(s=>/초재진/.test(s))
  };
  const mapData=new Map();
  let bit90=0;
  for(let i=hIdx+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r[idx.id]) continue;
    const pid=String(r[idx.id]);
    if(!mapData.has(pid)){
      mapData.set(pid,{id:pid,name:r[idx.name]||'미상',addr:r[idx.addr]||'',visits:[],hasNew:false,hasOld:false});
    }
    const p=mapData.get(pid);
    const bit=String(r[idx.bit]||'');
    if(/90/.test(bit)) bit90++;
    if(/신환/.test(bit) || /90/.test(bit)) p.hasNew=true;
    if(/재진/.test(bit)) p.hasOld=true;
    p.visits.push({bit});
  }
  patients=Array.from(mapData.values()).map(p=>{
    p.total=p.visits.length;
    if(p.hasNew && p.hasOld) p.type='신환 ▶ 재진 전환';
    else if(p.hasOld) p.type='재진';
    else p.type='신환';
    return p;
  });
  drawMarkers();
  document.getElementById('stat').innerText =
    `환자 ${patients.length}명 / 90일초진 비트 ${bit90}건`;
}

function drawMarkers(){
  clusterer.clear();
  patients.forEach(p=>{
    if(!p.addr) return;
    geocoder.addressSearch(p.addr,(res,st)=>{
      if(st!==kakao.maps.services.Status.OK) return;
      const latlng=new kakao.maps.LatLng(res[0].y,res[0].x);
      const marker=new kakao.maps.Marker({position:latlng});
      const iw=new kakao.maps.InfoWindow({
        content:`<div style="padding:6px"><b>${p.id} ${p.name}</b><br/>${p.type}<br/>내원 ${p.total}회</div>`
      });
      kakao.maps.event.addListener(marker,'click',()=>iw.open(map,marker));
      clusterer.addMarker(marker);
    });
  });
}
</script>
</body>
</html>
