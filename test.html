<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL MAP v2.3.7</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,drawing,clusterer"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <style>
    :root { 
      --blue:#228be6; --blue-light:#e7f5ff;
      --red:#fa5252; --red-light:#fff5f5;
      --border:#dee2e6; --text:#343a40; --bg:#f8f9fa; --card:#fff;
      --c-new:#ff0000; --c-conv:#00c853; --c-90:#ffd400; --c-ret:#228be6;
      --shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    
    *{box-sizing:border-box;font-family:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-size:13px;}
    .app{display:flex;height:100%;width:100%;}
    
    .sidebar{width:360px;min-width:360px;height:100%;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;}
    .sidebarHeader{padding:15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .brand{font-weight:900;font-size:16px;}
    .sidebarBody{flex:1;overflow-y:auto;padding:15px;}
    
    .section{background:#fff;border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:12px;}
    .sectionTitle{font-weight:800;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
    .pill{font-size:10px;background:var(--blue);color:white;padding:3px 6px;border-radius:4px;font-weight:normal;}
    
    .uploadBox{border:2px dashed #adb5bd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;background:#f8f9fa;transition:0.2s;}
    .uploadBox:hover, .uploadBox.dragover{border-color:var(--blue);background:var(--blue-light);}
    
    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;background:#f8f9fa;padding:10px;border-radius:6px;}
    .statItem{text-align:center;}
    .statLabel{font-size:11px;color:#868e96;margin-bottom:2px;}
    .statValue{font-size:16px;font-weight:800;color:var(--text);}
    
    .input-group { display: flex; gap: 5px; margin-bottom: 5px; }
    .input-box { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #f1f3f5; }
    .row:last-child { border-bottom: none; }
    .toggle { width: 36px; height: 20px; background: #e9ecef; border-radius: 20px; position: relative; cursor: pointer; transition: 0.3s; }
    .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: 0.3s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .toggle.on { background: var(--blue); }
    .toggle.on::after { transform: translateX(16px); }
    
    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .btn{width:100%;padding:10px;border-radius:6px;border:none;font-weight:700;cursor:pointer;font-size:12px;transition:0.2s; text-align:center;}
    .btn.primary{background:var(--blue);color:white;}
    .btn.danger{background:var(--red-light);color:var(--red);}
    .btn.outline{background:#fff;border:1px solid var(--border);color:var(--text);}
    .btn.purple{background:#7048e8;color:white;}

    .search-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
    .search-btn{
      padding:8px 4px;border:1px solid var(--border);border-radius:6px;background:#fff;
      cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
      font-weight:600;color:#495057; transition:0.2s; font-size:11px;
    }
    .search-btn.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue);}

    .mapArea{flex:1;position:relative;}
    #map{width:100%;height:100%;}

    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9999;display:none;justify-content:center;align-items:center;}
    .modalPanel{width:90%;max-width:800px;background:white;border-radius:12px;height:85vh;display:flex;flex-direction:column;}
    .modalHeader{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:16px;}
    .modalBody{flex:1;overflow-y:auto;padding:20px;}
    
    .result-list { list-style:none; padding:0; margin:0; }
    .result-item { padding:10px; border-bottom:1px solid #eee; cursor:pointer; transition:0.1s; }
    .result-item:hover { background: #f8f9fa; }
    .result-item .place { font-weight:bold; font-size:14px; color:var(--blue); }
    .result-item .addr { font-size:12px; color:#666; margin-top:2px; }

    #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:0.3s;pointer-events:none;z-index:2000;}
    #toast.show{opacity:1;bottom:50px;}
    
    #mapLegend{
      position:absolute;top:12px;left:12px;z-index:20;
      background:rgba(255,255,255,0.95);padding:10px;border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);font-size:11px;
      display:flex;flex-direction:column;gap:5px;
    }
    .legend-item{display:flex;align-items:center;gap:6px;}
    .dot{width:10px;height:10px;border-radius:50%;}

    .map-controls-container {
      position: absolute; top: 12px; right: 12px; z-index: 150;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }
    .map-type-group { display: flex; background: white; border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid #b8b8b8; }
    .map-type-btn { padding: 7px 12px; border: none; background: white; font-size: 12px; font-weight: 600; color: #444; cursor: pointer; border-right: 1px solid #ddd; }
    .map-type-btn.active { background: #228be6; color: white; }

    .vertical-toolbar {
      width: 44px; background: white; border-radius: 4px;
      box-shadow: var(--shadow); border: 1px solid #b8b8b8;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .v-tool-btn {
      width: 44px; height: 44px; border: none; background: white;
      cursor: pointer; display: flex; flex-direction: column; 
      align-items: center; justify-content: center; gap: 2px;
      border-bottom: 1px solid #eee; color: #333;
    }
    .v-tool-btn span { font-size: 18px; }
    .v-tool-btn .lbl { font-size: 9px; font-weight: 600; line-height: 1; color: #666; }
    .v-tool-btn.active { background: #e7f5ff; color: #228be6; }
    .v-tool-btn.active .lbl { color: #228be6; }
    .v-tool-btn.danger { color: #fa5252; }
    .v-tool-btn.danger .lbl { color: #fa5252; }
  </style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebarHeader">
      <div class="brand">JINSUL MAP v2.3</div>
      <div style="font-size:11px;color:#868e96;">v2.3.7</div>
    </div>
    
    <div class="sidebarBody">
      <div class="section">
        <div class="sectionTitle">환자 데이터 업로드 <span class="pill">Excel</span></div>
        <div class="uploadBox" id="uploadBox" onclick="document.getElementById('fileInput').click()">
          📂 환자 엑셀 업로드<br>
          <span style="font-size:11px;color:#868e96;">클릭 또는 파일 드래그</span>
          <input type="file" id="fileInput" hidden accept=".xlsx, .xls, .csv">
        </div>
        <div class="statGrid">
          <div class="statItem">
            <div class="statLabel">총 인원</div>
            <div class="statValue" id="statTotalUsers">0</div>
          </div>
          <div class="statItem">
            <div class="statLabel">총 방문</div>
            <div class="statValue" id="statTotalVisits">0</div>
          </div>
        </div>
        <div class="btnRow">
          <button class="btn primary" id="btnStats">📊 통계 상세 분석</button>
          <button class="btn outline" id="btnClear">초기화</button>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle">환자 필터 <span class="pill">ON/OFF</span></div>
        <div class="row"><span>전체 보기</span><div class="toggle on" data-toggle="all"></div></div>
        <div class="row"><span style="color:var(--c-new)">● 신환 (1회만)</span><div class="toggle on" data-toggle="new_only"></div></div>
        <div class="row"><span style="color:var(--c-conv)">● 신환 ▶ 재진 전환</span><div class="toggle on" data-toggle="new_conv"></div></div>
        <div class="row"><span style="color:var(--c-90)">● 90일초</span><div class="toggle on" data-toggle="bit_90"></div></div>
        <div class="row"><span style="color:var(--c-ret)">● 재진</span><div class="toggle on" data-toggle="old"></div></div>
        <button class="btn outline" id="btnFit" style="width:100%;margin-top:10px;">지도 범위 최적화</button>
      </div>

      <div class="section">
        <div class="sectionTitle">우리 병원 및 시설 검색</div>
        <div class="input-group">
          <input type="text" class="input-box" id="myHospitalInput" placeholder="우리 병원명/주소 입력">
          <button class="btn primary" id="btnSetHospital" style="width:50px;">설정</button>
        </div>
        <button class="btn outline" id="btnClearHospital" style="width:100%;margin-bottom:10px;font-size:11px;padding:5px;">설정 해제</button>

        <div class="search-grid">
          <div class="search-btn" data-target="senior"><span>🏠</span><span>경로당</span></div>
          <div class="search-btn" data-target="welfare"><span>💜</span><span>복지관</span></div>
          <div class="search-btn" data-target="ortho"><span>🏥</span><span>경쟁병원</span></div>
        </div>
        <div style="font-size:11px;color:#868e96;text-align:center;margin:8px 0;" id="searchStatus">대기</div>
        <div class="btnRow">
          <button class="btn primary" id="btnSearch">시설 스캔</button>
          <button class="btn outline" id="btnResetSearch">초기화</button>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle">홍보 방문 루트</div>
        <button class="btn purple" id="btnRouteOpt">🚀 최적 방문 경로 생성</button>
      </div>
    </div>
    <div style="padding:10px;text-align:center;font-size:10px;color:#adb5bd;border-top:1px solid #eee;">
      JINSUL MAP v2.3.7<br>All Rights Reserved.
    </div>
  </div>

  <div class="mapArea">
    <div id="map"></div>
    <div id="mapLegend">
      <div class="legend-item"><div class="dot" style="background:#ff0000"></div>신환(1회)</div>
      <div class="legend-item"><div class="dot" style="background:#00c853"></div>재진전환</div>
      <div class="legend-item"><div class="dot" style="background:#ffd400"></div>90일초</div>
      <div class="legend-item"><div class="dot" style="background:#228be6"></div>재진</div>
    </div>
    <div class="map-controls-container">
      <div class="map-type-group">
        <button class="map-type-btn active" id="btnMapRoad">지도</button>
        <button class="map-type-btn" id="btnMapSky">스카이</button>
      </div>
      <div class="vertical-toolbar">
        <button class="v-tool-btn" id="btnRadius" title="반경"><span>⭕</span><span class="lbl">반경</span></button>
        <button class="v-tool-btn" id="btnDist" title="거리"><span>📏</span><span class="lbl">거리</span></button>
        <button class="v-tool-btn" id="btnPoint" title="포인트"><span>🚩</span><span class="lbl">포인트</span></button>
        <button class="v-tool-btn danger" id="btnClearTools" title="삭제"><span>🗑️</span><span class="lbl">삭제</span></button>
      </div>
    </div>
  </div>
</div>

<div id="hospitalListModal" class="modalBack">
  <div class="modalPanel" style="height:500px;max-width:400px;">
    <div class="modalHeader">우리 병원 검색 결과<span style="cursor:pointer;" onclick="$('hospitalListModal').style.display='none'">✕</span></div>
    <div class="modalBody"><ul id="hospitalResults" class="result-list"></ul></div>
  </div>
</div>

<div id="toast">알림</div>

<script>
const MY_HOSPITAL_IMG = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png";
const REP_COLOR = { "신환 (1회만)": "#ff0000", "신환 ▶ 재진 전환": "#00c853", "90일초": "#ffd400", "재진": "#228be6" };
const SVG_MARKERS = {
  senior: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23964b00%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E",
  welfare: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23845ef7%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E",
  ortho: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%20viewBox%3D%220%200%2030%2030%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2213%22%20fill%3D%22%23ff5e57%22%20stroke%3D%22white%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M15%208v14M8%2015h14%22%20stroke%3D%22white%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E"
};

let map, clusterer, geocoder, places, myHospitalMarker = null;
let patients = [], targetMarkers = { senior:[], welfare:[], ortho:[] }, promoPoints = [];
let pointMode = false;
const toggleState = { all: true, new_only: true, new_conv: true, bit_90: true, old: true };

const $ = (id) => document.getElementById(id);
const toast = (msg) => { const t=$('toast'); t.innerText=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); };

function initKakao(){
  if(!window.kakao || !kakao.maps) { setTimeout(initKakao, 100); return; }
  kakao.maps.load(() => {
    map = new kakao.maps.Map($('map'), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7 });
    geocoder = new kakao.maps.services.Geocoder();
    places = new kakao.maps.services.Places();
    clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 5 });
    setupMapListeners(); setupToolbar(); 
    toast("준비 완료 (v2.3.7)");
  });
}
initKakao();

// === 정밀 중복 제거 로직 복구 ===
function extractNumber(name) { const match = name.match(/(\d+)(차|단지|회)/); return match ? match[1] : null; }
function cleanName(name) { return name.replace(/아파트|빌라|맨션|오피스텔|주상복합/g, "").replace(/\s/g, ""); }
function getPriority(name) { if(/경로당|노인정|무더위쉼터/.test(name)) return 1; if(/관리사무소/.test(name)) return 2; if(/경비실/.test(name)) return 3; return 4; }

function setupMapListeners() {
  kakao.maps.event.addListener(map, 'click', function(me){
    if (pointMode) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><text x="0" y="24" font-size="24">🚩</text></svg>`;
      const m = new kakao.maps.Marker({ position: me.latLng, image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(30,30)), zIndex: 100 });
      m.setMap(map); promoPoints.push(m); return;
    }
  });
  $('myHospitalInput').onkeypress = (e) => { if(e.keyCode === 13) $('btnSetHospital').click(); };
}

function setupToolbar(){
  ['btnRadius','btnDist','btnPoint'].forEach(id => {
    $(id).onclick = function(){ document.querySelectorAll('.v-tool-btn').forEach(b=>b.classList.remove('active')); pointMode = false; map.setCursor('auto'); this.classList.add('active'); if(id === 'btnPoint') { pointMode = true; map.setCursor('crosshair'); toast("포인트 모드"); } };
  });
  $('btnClearTools').onclick = () => { promoPoints.forEach(p => p.setMap(null)); promoPoints = []; Object.values(targetMarkers).forEach(arr => arr.forEach(m => m.setMap(null))); if(myHospitalMarker) { myHospitalMarker.setMap(null); myHospitalMarker = null; $('myHospitalInput').value = ""; } toast("초기화됨"); };
}

$('btnSetHospital').onclick = () => {
  const q = $('myHospitalInput').value.trim(); if(!q) return;
  const res = []; let pD=false, aD=false;
  places.keywordSearch(q, (d, s) => { if(s === kakao.maps.services.Status.OK) res.push(...d); pD = true; if(pD && aD) showHospitalList(res); });
  geocoder.addressSearch(q, (d, s) => { if(s === kakao.maps.services.Status.OK) { const al = d.map(x => ({ place_name: x.address_name, address_name: x.road_address?.address_name || x.address.address_name, x: x.x, y: x.y })); res.push(...al); } aD = true; if(pD && aD) showHospitalList(res); });
};
function showHospitalList(l){ if(!l.length) return; const ul = $('hospitalResults'); ul.innerHTML = ""; l.forEach(i => { const li = document.createElement('li'); li.className = 'result-item'; li.innerHTML = `<div class="place">${i.place_name}</div><div class="addr">${i.address_name||""}</div>`; li.onclick = () => { setMyHospital(i); $('hospitalListModal').style.display = 'none'; }; ul.appendChild(li); }); $('hospitalListModal').style.display = 'flex'; }
function setMyHospital(p) { const ll = new kakao.maps.LatLng(p.y, p.x); if(myHospitalMarker) myHospitalMarker.setMap(null); myHospitalMarker = new kakao.maps.Marker({ position: ll, image: new kakao.maps.MarkerImage(MY_HOSPITAL_IMG, new kakao.maps.Size(24,35)), map: map, zIndex: 1000 }); map.panTo(ll); $('myHospitalInput').value = p.place_name; }

$('btnSearch').onclick = async () => {
  const actives = document.querySelectorAll('.search-btn.active'); if(!actives.length) return toast("대상 선택");
  Object.values(targetMarkers).forEach(arr => arr.forEach(m => m.setMap(null))); targetMarkers = { senior:[], welfare:[], ortho:[] };
  const bounds = map.getBounds(); $('searchStatus').innerText = "스캔 중...";
  for(const btn of actives){
    const t = btn.dataset.target; let k = [], img;
    if(t === 'senior') { k = ['경로당','마을회관','노인정','경비실','관리사무소']; img = SVG_MARKERS.senior; }
    else if (t === 'welfare') { k = ['노인복지','주간보호']; img = SVG_MARKERS.welfare; }
    else if (t === 'ortho') { k = ['정형외과','통증의학과']; img = SVG_MARKERS.ortho; }
    
    let raw = [];
    for(const kw of k){
      await new Promise(r => {
        places.keywordSearch(kw, (d, s) => { if(s === kakao.maps.services.Status.OK) raw.push(...d); r(); }, { bounds: bounds });
      });
    }

    // === 정밀 중복 제거 적용 (경비실/단지 로직) ===
    let unique = raw.filter((v,i,a)=>a.findIndex(x=>x.id===x.id)===i);
    let final = []; let proc = new Set();
    unique.forEach((item, idx) => {
      if(proc.has(item.id)) return;
      let group = [item]; proc.add(item.id);
      const p1 = new kakao.maps.LatLng(item.y, item.x);
      for(let i=idx+1; i<unique.length; i++){
        if(proc.has(unique[i].id)) continue;
        const other = unique[i]; const p2 = new kakao.maps.LatLng(other.y, other.x);
        const poly = new kakao.maps.Polyline({ path: [p1, p2] });
        const dist = poly.getLength();
        let limit = 80; if(item.place_name.includes('경비실') || other.place_name.includes('경비실')) limit = 300;
        if(dist <= limit) {
          const n1 = cleanName(item.place_name); const n2 = cleanName(other.place_name);
          const num1 = extractNumber(item.place_name); const num2 = extractNumber(other.place_name);
          if(num1 && num2 && num1 !== num2) continue;
          if(n1.includes(n2) || n2.includes(n1)) { group.push(other); proc.add(other.id); }
        }
      }
      group.sort((a,b) => getPriority(a.place_name) - getPriority(b.place_name));
      final.push(group[0]);
    });

    final.forEach(p => {
      const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(p.y, p.x), image: new kakao.maps.MarkerImage(img, new kakao.maps.Size(30,30)), map: map });
      targetMarkers[t].push(marker);
    });
  }
  $('searchStatus').innerText = "완료";
};
// 환자 분석 로직 생략(V2.3.3 기준 유지)
</script>
