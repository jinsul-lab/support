<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL-주소 분석 시스템 (v1.2.8)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services,drawing,clusterer&autoload=false"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

  <style>
    /* add-kakao.html 스타일 그대로 적용 */
    :root { --blue:#228be6; --border:rgba(0,0,0,.10); --text:#1f2937; --gray:#868e96; --bg:#f8f9fa; --card:#fff; --shadow:0 10px 28px rgba(0,0,0,.10); --radius:20px; --danger:#db4040; }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden}
    .app{height:100%;width:100%;display:flex}

    .sidebar{width:360px;min-width:360px;height:100%;background:var(--card);border-right:1px solid var(--border);box-shadow:var(--shadow);z-index:20;transform:translateX(0);transition:transform 180ms ease;display:flex;flex-direction:column;position:relative;overflow:hidden;}
    .sidebar.collapsed{transform:translateX(-360px)}

    .sidebarHeader{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brandTitle{font-weight:1000;letter-spacing:.4px;font-size:14px;white-space:nowrap;}
    .iconBtn{border:1px solid var(--border);background:#fff;color:var(--text);height:38px;width:38px;border-radius:14px;display:grid;place-items:center;cursor:pointer;user-select:none;box-shadow:0 4px 12px rgba(0,0,0,.06)}
    .iconBtn:hover{background:rgba(34,139,230,.06);border-color:rgba(34,139,230,.35)}
    .sidebarBody{position:relative;z-index:1;padding:14px;overflow:auto}

    .section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .sectionTitle h3{margin:0;font-size:13px;letter-spacing:.3px}
    .pill{font-size:12px;color:#fff;background:var(--blue);padding:6px 10px;border-radius:999px;font-weight:1000;white-space:nowrap}

    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(0,0,0,.06)}
    .row:first-of-type{border-top:0;padding-top:0}
    .rowLabel b{font-size:13px;font-weight:1000}

    .toggle{position:relative;width:46px;height:26px;border-radius:999px;background:rgba(0,0,0,.10);border:1px solid var(--border);cursor:pointer;flex:0 0 auto;}
    .toggle.on{background:rgba(34,139,230,.20);border-color:rgba(34,139,230,.45)}
    .toggleKnob{position:absolute;top:50%;transform:translateY(-50%);left:3px;width:20px;height:20px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.08);transition:left 140ms ease;box-shadow:0 4px 10px rgba(0,0,0,.08)}
    .toggle.on .toggleKnob{left:23px}

    /* add-kakao.html의 시설 검색 버튼 스타일 */
    .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .search-btn {
      padding: 12px; border: 1px solid #dee2e6; border-radius: 8px; background: #fff;
      cursor: pointer; font-size: 13px; text-align: center; font-weight: 600;
      transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
    }
    .search-btn:hover { background: #f8f9fa; border-color: var(--blue); color: var(--blue); }
    .search-btn.active { background: #e7f5ff; border-color: var(--blue); color: var(--blue); }
    .search-icon { font-size: 18px; }

    .btnRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .btn{border:1px solid var(--border);background:#fff;color:var(--text);padding:10px 10px;border-radius:14px;cursor:pointer;font-weight:1000;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .btn:hover{background:rgba(34,139,230,.06);border-color:rgba(34,139,230,.35)}
    .btn.primary{border-color:rgba(34,139,230,.45);background:rgba(34,139,230,.10)}
    .btn.danger{border-color:rgba(219,64,64,.35);background:rgba(219,64,64,.08)}

    .statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .stat{border:1px solid var(--border);border-radius:14px;padding:12px;background:rgba(0,0,0,.02)}
    .stat .k{color:var(--gray);font-size:12px;font-weight:900}
    .stat .v{margin-top:4px;font-size:18px;font-weight:1000;letter-spacing:.3px}

    .uploadBox{border:1px dashed rgba(34,139,230,.45);background:rgba(34,139,230,.06);border-radius:16px;padding:12px;display:grid;gap:10px;cursor:pointer;}
    
    .mapArea{flex:1 1 auto;height:100%;position:relative;overflow:hidden}
    #map{width:100%;height:100%;background:#e9ecef}
    .mapControls{position:absolute;top:12px;right:12px;z-index:30;display:flex;flex-direction:column;gap:8px}
    .ctrl{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:18px;padding:8px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
    .ctrl .miniBtn{width:42px;height:42px;border-radius:16px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;display:grid;place-items:center;font-weight:1000;user-select:none}
    
    .toast{position:absolute;left:12px;bottom:12px;z-index:40;max-width:min(520px,calc(100vw - 24px));background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);color:var(--text);font-size:13px;display:none;backdrop-filter:blur(6px)}
    .toast.show{display:block}

    .roadviewPanel{position:absolute;right:12px;bottom:12px;z-index:50;width:min(460px, calc(100vw - 24px));height:320px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:none;backdrop-filter: blur(6px);}
    .roadviewPanel.show{display:block}
    .roadviewHeader{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.08);font-weight:1000;font-size:12px;}
    #roadview{width:100%;height:calc(100% - 42px);}

    /* 통계 모달 */
    .modalBack{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:none;justify-content:center;align-items:center;}
    .modalPanel{width:90%;max-width:800px;height:80vh;background:white;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;}
    .modalHeader{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:bold;}
    .modalBody{padding:20px;overflow-y:auto;flex:1;}
    .tabBar{display:flex;gap:10px;padding:10px 15px;border-bottom:1px solid #eee;}
    .tabBtn{padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer;}
    .tabBtn.active{background:#333;color:white;border-color:#333;}
    table.miniTable{width:100%;border-collapse:collapse;font-size:12px;}
    table.miniTable th{background:#f8f9fa;padding:8px;text-align:left;position:sticky;top:0;}
    table.miniTable td{padding:8px;border-bottom:1px solid #eee;}

    /* 범례 */
    #mapLegend {position:absolute;bottom:20px;left:20px;z-index:20;background:rgba(255,255,255,0.95);padding:10px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.15);font-size:11px;display:flex;flex-direction:column;gap:5px;}
    .legend-item{display:flex;align-items:center;gap:8px;}
    .legend-color{width:12px;height:12px;border-radius:50%;}
    
    .dotOverlay {position:relative;bottom:10px;border-radius:6px;border: 1px solid #ccc;border-bottom:2px solid #ddd;float:left;font-size:12px;padding:5px;background:#fff;}
    .number {font-weight:bold;color:#ee6152;}
  </style>
</head>
<body>

<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="sidebarHeader">
      <div class="brand"><div class="brandTitle">JINSUL 분석 시스템 v1.2.8</div></div>
      <button id="btnCollapse" class="iconBtn">☰</button>
    </div>

    <div class="sidebarBody">
      <div class="section">
        <div class="sectionTitle"><h3>환자 데이터 업로드</h3><span class="pill">BIT/의사랑</span></div>
        <div id="uploadBox" class="uploadBox" onclick="$('#fileInput').click()">
          <div style="font-weight:1000;font-size:13px;text-align:center;">파일 선택 또는 드래그&드롭</div>
          <input id="fileInput" type="file" accept=".xls,.xlsx,.csv" style="display:none"/>
        </div>
        <div class="btnRow">
          <button id="btnClearPatients" class="btn danger">환자 초기화</button>
          <button id="btnFitPatients" class="btn primary">전체 보기</button>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle"><h3>환자 필터</h3><span class="pill">표시 설정</span></div>
        <div class="row"><div class="rowLabel"><b>신환 (New)</b></div><div class="toggle on" data-toggle="patient_new"><div class="toggleKnob"></div></div></div>
        <div class="row"><div class="rowLabel"><b>90일초 (Return)</b></div><div class="toggle on" data-toggle="patient_90"><div class="toggleKnob"></div></div></div>
        <div class="row"><div class="rowLabel"><b>재진 (Old)</b></div><div class="toggle on" data-toggle="patient_return"><div class="toggleKnob"></div></div></div>
        <div class="statGrid">
          <div class="stat"><div class="k">총 인원</div><div id="statPatientsUnique" class="v">0</div></div>
          <div class="stat"><div class="k">총 방문</div><div id="statPatientsVisits" class="v">0</div></div>
        </div>
        <button id="btnOpenStats" class="btn" style="margin-top:10px;">📊 상세 통계 보기</button>
      </div>

      <div class="section">
        <div class="sectionTitle"><h3>시설 검색</h3><span class="pill">강력 스캔</span></div>
        <div class="search-grid">
          <div class="search-btn" data-target="target_senior">
            <span class="search-icon">🏠</span> 경로당
          </div>
          <div class="search-btn" data-target="target_welfare">
            <span class="search-icon">💜</span> 노인재가
          </div>
          <div class="search-btn" data-target="target_ortho">
            <span class="search-icon">🏥</span> 정형외과+
          </div>
          <div class="search-btn" id="btnResetTargets" style="background:#fff0f0; border-color:#ffc9c9; color:#fa5252;">
            <span class="search-icon">🗑️</span> 지우기
          </div>
        </div>
        <div class="btnRow">
          <button id="btnSearchTargets" class="btn primary">화면 내 검색</button>
        </div>
        <div class="statGrid">
          <div class="stat"><div class="k">검색된 시설</div><div id="statTargetsTotal" class="v">0</div></div>
          <div class="stat"><div class="k">상태</div><div id="statTargetsUpdated" class="v" style="font-size:12px;">대기</div></div>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle"><h3>도구</h3><span class="pill">ON/OFF</span></div>
        <div class="row"><div class="rowLabel"><b>반경 그리기</b></div><div class="toggle" data-toggle="radius_enabled"><div class="toggleKnob"></div></div></div>
        <div class="row"><div class="rowLabel"><b>거리 측정</b></div><div class="toggle" data-toggle="tool_distance"><div class="toggleKnob"></div></div></div>
        <div class="row"><div class="rowLabel"><b>로드뷰(보기)</b></div><div class="toggle" data-toggle="tool_roadview"><div class="toggleKnob"></div></div></div>
      </div>
    </div>
  </aside>

  <main class="mapArea">
    <button id="btnOpenSidebar" class="iconBtn" style="position:absolute;top:12px;left:12px;z-index:30;display:none;">☰</button>
    <div id="map"></div>
    
    <div id="mapLegend">
      <div style="font-weight:bold;margin-bottom:5px;border-bottom:1px solid #eee;">방문 횟수</div>
      <div class="legend-item"><div class="legend-color" style="background:#db4040"></div> 5회 이상</div>
      <div class="legend-item"><div class="legend-color" style="background:orange"></div> 4회</div>
      <div class="legend-item"><div class="legend-color" style="background:#CCCC00"></div> 3회</div>
      <div class="legend-item"><div class="legend-color" style="background:green"></div> 2회</div>
      <div class="legend-item"><div class="legend-color" style="background:#228be6"></div> 1회</div>
    </div>

    <div class="mapControls">
      <div class="ctrl">
        <button id="btnZoomIn" class="miniBtn" title="확대">+</button>
        <button id="btnZoomOut" class="miniBtn" title="축소">−</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="roadviewPanel" class="roadviewPanel">
      <div class="roadviewHeader">
        <div>로드뷰</div>
        <button id="btnCloseRoadview" class="iconBtn" style="height:24px;width:24px;">✕</button>
      </div>
      <div id="roadview"></div>
    </div>
  </main>
</div>

<div id="statsModal" class="modalBack">
  <div class="modalPanel">
    <div class="modalHeader"><span>상세 통계</span><button id="btnCloseStats" style="border:none;background:none;font-size:20px;cursor:pointer;">✕</button></div>
    <div class="tabBar">
      <button class="tabBtn active" data-tab="tabSummary">요약</button>
      <button class="tabBtn" data-tab="tabDong">행정동별</button>
      <button class="tabBtn" data-tab="tabAge">연령별</button>
    </div>
    <div class="modalBody">
      <div id="tabSummary" class="tabPane">
        <div style="height:300px;"><canvas id="chartType_modal"></canvas></div>
        <div class="statGrid" style="margin-top:20px;">
          <div class="stat"><div class="k">신환 비율</div><div class="v" id="kpiNewRate">0%</div></div>
          <div class="stat"><div class="k">재진 비율</div><div class="v" id="kpiRetRate">0%</div></div>
        </div>
      </div>
      <div id="tabDong" class="tabPane" style="display:none;">
        <table class="miniTable">
          <thead><tr><th>행정동</th><th>신환</th><th>90일</th><th>재진</th><th>합계</th></tr></thead>
          <tbody id="tblDongType"></tbody>
        </table>
      </div>
      <div id="tabAge" class="tabPane" style="display:none;">
        <div style="height:300px;"><canvas id="chartAge_modal"></canvas></div>
        <table class="miniTable" style="margin-top:20px;"><thead><tr><th>연령대</th><th>인원수</th><th>비율</th></tr></thead><tbody id="tblAge"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

let map, geocoder, places, clusterer, roadview, roadviewClient;
let patientRecords = [], targetMarkers = { senior:[], welfare:[], ortho:[] };
let radiusFlag=false, radiusCenter=null, radiusPolyline=null, radiusCircle=null;
let distFlag=false, distClickLine=null, distMoveLine=null, distOverlay=null;

const state = {
  patient_new:true, patient_90:true, patient_return:true,
  target_senior:false, target_welfare:false, target_ortho:false,
  radius_enabled:false, tool_distance:false, tool_roadview:false
};

function toast(msg, ms=2000){
  const t=$("#toast"); t.innerText=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), ms);
}

// Sidebar
$("#btnCollapse").onclick = () => $("#sidebar").classList.toggle("collapsed");
$("#btnOpenSidebar").onclick = () => $("#sidebar").classList.remove("collapsed");

// Toggle Logic
$$(".toggle").forEach(t => t.addEventListener("click", ()=>{
  const name = t.getAttribute("data-toggle");
  state[name] = !state[name];
  t.classList.toggle("on", state[name]);
  
  if(name.startsWith("patient_") || name==="radius_enabled") applyFilters();
  if(name.startsWith("tool_")) toggleTool(name);
}));

// 검색 버튼 토글 (UI 동작)
$$(".search-btn").forEach(btn => {
  if(btn.id === "btnResetTargets") return;
  btn.addEventListener("click", () => {
    const target = btn.getAttribute("data-target");
    state[target] = !state[target];
    btn.classList.toggle("active", state[target]);
  });
});

// Kakao Init
function initKakao(){
  if(!window.kakao || !kakao.maps){ setTimeout(initKakao, 100); return; }
  kakao.maps.load(()=>{
    map = new kakao.maps.Map($("#map"), { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 7 });
    geocoder = new kakao.maps.services.Geocoder();
    places = new kakao.maps.services.Places();
    clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 5 });
    roadview = new kakao.maps.Roadview($("#roadview"));
    roadviewClient = new kakao.maps.RoadviewClient();

    $("#btnZoomIn").onclick = () => map.setLevel(map.getLevel()-1);
    $("#btnZoomOut").onclick = () => map.setLevel(map.getLevel()+1);

    kakao.maps.event.addListener(map, "click", (e)=>{
      if(state.radius_enabled && !radiusCenter){
        radiusCenter = e.latLng;
        if(radiusCircle) radiusCircle.setMap(null);
        radiusCircle = new kakao.maps.Circle({ map:map, center:radiusCenter, radius:0, strokeWeight:1, strokeColor:'#228be6', fillOpacity:0.2 });
        radiusFlag = true;
        toast("마우스를 움직여 반경 조절 후 클릭하세요");
      } else if(state.radius_enabled && radiusFlag){
        radiusFlag = false;
        applyFilters();
        toast("반경 설정 완료");
      }
      
      if(state.tool_distance) onDistClick(e.latLng);
      if(state.tool_roadview) openRoadview(e.latLng);
    });

    kakao.maps.event.addListener(map, "mousemove", (e)=>{
      if(state.radius_enabled && radiusFlag && radiusCenter){
        const poly = new kakao.maps.Polyline({ path:[radiusCenter, e.latLng] });
        radiusCircle.setRadius(poly.getLength());
      }
      if(state.tool_distance && distFlag) onDistMove(e.latLng);
    });

    kakao.maps.event.addListener(map, "rightclick", ()=>{ if(state.tool_distance) onDistEnd(); });

    toast("시스템 준비 완료 v1.2.8");
  });
}
initKakao();

// =========================================================================
//  [핵심 복구] add-kakao.html 의 '지도 쪼개기(Tiling)' 검색 로직 100% 이식
// =========================================================================

// 아이콘 정의 (add-kakao.html 스타일)
const TARGET_SVGS = {
  senior: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23964b00%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E",
  welfare: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%23845ef7%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E",
  ortho: "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2230%22%20height%3D%2230%22%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2215%22%20r%3D%2214%22%20fill%3D%22white%22%20stroke%3D%22%232b8a3e%22%20stroke-width%3D%223%22/%3E%3Ctext%20x%3D%2215%22%20y%3D%2221%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%3E%F0%9F%8F%A5%3C/text%3E%3C/svg%3E"
};

// 1. 타일링 함수: 영역을 4분할 (add-kakao.html 원본)
function tileBounds(bounds){
  const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  const midLat = (sw.getLat() + ne.getLat()) / 2;
  const midLng = (sw.getLng() + ne.getLng()) / 2;
  return [
    new kakao.maps.LatLngBounds(sw, new kakao.maps.LatLng(midLat, midLng)),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(sw.getLat(), midLng), new kakao.maps.LatLng(midLat, ne.getLng())),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(midLat, sw.getLng()), new kakao.maps.LatLng(ne.getLat(), midLng)),
    new kakao.maps.LatLngBounds(new kakao.maps.LatLng(midLat, midLng), ne)
  ];
}

// 2. 기본 검색 함수 (add-kakao.html 원본)
function keywordSearchAllBase(keyword, bounds){
  return new Promise((resolve)=>{
    const collected=[];
    const options={ bounds: bounds };
    const cb=(data,status,pagination)=>{
      if(status===kakao.maps.services.Status.OK && data && data.length){
        collected.push(...data);
        if(pagination && pagination.hasNextPage){
          pagination.nextPage();
          return;
        }
        resolve(collected);
      } else {
        resolve(collected);
      }
    };
    places.keywordSearch(keyword, cb, options);
  });
}

// 3. 강화 검색 함수 (재귀 호출로 무한 스캔 구현)
async function keywordSearchAllEnhanced(keyword, bounds, depth=0){
  const data = await keywordSearchAllBase(keyword, bounds);
  // 45개 이상이면 타일링하여 재검색 (이게 핵심)
  if(data.length >= 45 && depth < 2){
    const tiles=tileBounds(bounds);
    const all=[];
    for(const tb of tiles){
      const part = await keywordSearchAllEnhanced(keyword, tb, depth+1);
      all.push(...part);
    }
    const uniq=new Map();
    for(const p of [...data,...all]){
      const id=p.id || (p.place_name + "|" + p.x + "|" + p.y);
      if(!uniq.has(id)) uniq.set(id,p);
    }
    return Array.from(uniq.values());
  }
  return data;
}

// 4. 검색 실행 함수
function clearTargetMarkers(kind){ targetMarkers[kind].forEach(m=>m.setMap(null)); targetMarkers[kind]=[]; }

function addPlaceMarker(kind, place){
  const pos=new kakao.maps.LatLng(parseFloat(place.y), parseFloat(place.x));
  const marker=new kakao.maps.Marker({
    position:pos, map, 
    image: new kakao.maps.MarkerImage(TARGET_SVGS[kind], new kakao.maps.Size(30,30)),
    zIndex: 20
  });
  const iw=new kakao.maps.InfoWindow({ content:`<div style="padding:5px;font-size:12px;"><b>${place.place_name}</b><br>${place.category_name}</div>` });
  kakao.maps.event.addListener(marker,"click",()=>iw.open(map,marker));
  targetMarkers[kind].push(marker);
}

    for(const kw of keywords){

      data.forEach(p => addPlaceMarker("welfare", p));

  // [정형외과]
  if(doOrtho){
    const keywords = ["정형외과", "신경외과", "통증의학과", "재활의학과", "관절", "척추"];

      const data = await keywordSearchAllEnhanced(kw, b);

// =========================================================================
//  Patient Logic (v1.2.5 최신 버전 유지)
// =========================================================================
const fileInput = $("#fileInput");
fileInput.addEventListener("change", (e)=>{ if(e.target.files.length) handleFile(e.target.files[0]); e.target.value=""; });

async function handleFile(file){
  toast("파일 분석 중...");
  const reader = new FileReader();
  reader.onload = (e) => {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type:'array'});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, {header:1});
    processData(json);
  };
  reader.readAsArrayBuffer(file);
}

function processData(rows){
  let headerIdx = -1;
  for(let i=0; i<Math.min(rows.length, 30); i++){
    if(rows[i].join("").includes("주소") && (rows[i].join("").includes("차트") || rows[i].join("").includes("이름"))) { headerIdx=i; break; }
  }
  if(headerIdx<0){ toast("헤더를 찾을 수 없습니다."); return; }
  
  const headers = rows[headerIdx];
  const body = rows.slice(headerIdx+1);
  const pMap = new Map();

  body.forEach(row => {
    const getVal = (keys) => {
      const idx = headers.findIndex(h => keys.some(k => String(h).includes(k)));
      return idx > -1 ? row[idx] : null;
    };

    const chartNo = getVal(['차트','번호','ID']);
    const addr = getVal(['주소']);
    const name = getVal(['이름','수진자']);
    const typeVal = String(getVal(['구분','신환','초재진'])||"");
    let age = 0;
    
    // Age fix (52세2개월 -> 52)
    const ageRaw = String(getVal(['나이','연령'])||"");
    if(ageRaw.includes("세")) age = parseInt(ageRaw.split("세")[0].replace(/[^0-9]/g,"")) || 0;
    else age = parseInt(ageRaw.replace(/[^0-9]/g,"")) || 0;

    if(!chartNo || !addr) return;

    let isNew = typeVal.includes("신환") || typeVal.includes("신규");
    let is90 = typeVal.includes("90");
    
    if(pMap.has(chartNo)){
      const p = pMap.get(chartNo);
      p.visits++;
      if(p.type==="신환") {} 
      else if(isNew) p.type="신환";
      else if(is90 && p.type!=="신환") p.type="90일초";
    } else {
      let type = "재진";
      if(isNew) type="신환"; else if(is90) type="90일초";
      pMap.set(chartNo, { name, addr, type, age, visits:1, latlng:null, marker:null, dong:"" });
    }
  });

  patientRecords = Array.from(pMap.values());
  clusterer.clear();
  let done=0;
  patientRecords.forEach((p, idx)=>{
    setTimeout(()=>{
      geocoder.addressSearch(p.addr, (res, status)=>{
        if(status===kakao.maps.services.Status.OK){
          p.latlng = new kakao.maps.LatLng(res[0].y, res[0].x);
          p.dong = res[0].address.region_3depth_name;
          
          const color = p.visits>=5?'#db4040': p.visits===4?'orange': p.visits===3?'#CCCC00': p.visits===2?'green':'#228be6';
          const char = p.type==='신환'?'♥': p.type==='90일초'?'♡':'📍';
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><circle cx="15" cy="15" r="14" fill="${color}" stroke="white" stroke-width="2"/><text x="15" y="20" font-size="16" fill="white" text-anchor="middle">${char}</text></svg>`;
          
          p.marker = new kakao.maps.Marker({
            position: p.latlng,
            image: new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), new kakao.maps.Size(30,30))
          });
          const iw = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;font-size:12px;"><b>${p.name}</b> (${p.age}세)<br>${p.type} / ${p.visits}회</div>` });
          kakao.maps.event.addListener(p.marker, 'click', ()=>iw.open(map, p.marker));
          
          done++;
        }
        if(idx === patientRecords.length-1) { applyFilters(); toast(`${done}명 지도 표시`); }
      });
    }, idx*10);
  });
}

function applyFilters(){
  clusterer.clear();
  let unique=0, visits=0;
  const dongMap = {};
  
  patientRecords.forEach(p=>{
    if(!p.marker) return;
    let show = true;
    if(p.type==="신환" && !state.patient_new) show=false;
    if(p.type==="90일초" && !state.patient_90) show=false;
    if(p.type==="재진" && !state.patient_return) show=false;
    
    if(show && state.radius_enabled && radiusCenter && radiusCircle){
      const line = new kakao.maps.Polyline({ path:[radiusCenter, p.latlng] });
      if(line.getLength() > radiusCircle.getRadius()) show=false;
    }

    if(show){
      clusterer.addMarker(p.marker);
      unique++; visits+=p.visits;
      
      const d = p.dong || "미상";
      if(!dongMap[d]) dongMap[d] = {n:0, d:0, r:0, t:0};
      dongMap[d].t++;
      if(p.type==="신환") dongMap[d].n++;
      else if(p.type==="90일초") dongMap[d].d++;
      else dongMap[d].r++;
    }
  });
  
  $("#statPatientsUnique").innerText = unique;
  $("#statPatientsVisits").innerText = visits;
  updateStats(dongMap, unique);
}

function onDistClick(latlng){
  if(!distFlag){
    distFlag=true;
    if(distClickLine) distClickLine.setMap(null);
    distClickLine = new kakao.maps.Polyline({ map:map, path:[latlng], strokeWeight:3, strokeColor:'#db4040' });
  } else {
    const p = distClickLine.getPath(); p.push(latlng); distClickLine.setPath(p);
  }
}
function onDistMove(latlng){
  if(distFlag && distClickLine){
    const p = distClickLine.getPath();
    const dist = Math.round(distClickLine.getLength());
    toast(`거리: ${dist}m`, 500);
  }
}
function onDistEnd(){ distFlag=false; toast("거리 측정 종료"); }

function openRoadview(latlng){
  roadviewClient.getNearestPanoId(latlng, 50, (id)=>{
    if(id) roadview.setPanoId(id, latlng);
    else toast("로드뷰 데이터 없음");

}

let chartType;
function updateStats(dongMap, total){
  const tbody = $("#tblDongType");
  tbody.innerHTML = Object.entries(dongMap).sort((a,b)=>b[1].t-a[1].t).map(([d,v])=>
    `<tr><td>${d}</td><td>${v.n}</td><td>${v.d}</td><td>${v.r}</td><td><b>${v.t}</b></td></tr>`
  ).join("");

  if(window.Chart){
    let n=0, d=0, r=0;
    Object.values(dongMap).forEach(v => { n+=v.n; d+=v.d; r+=v.r; });
    if(chartType) chartType.destroy();
    chartType = new Chart($("#chartType_modal"), {
      type: 'doughnut',
      data: { labels:['신환','90일','재진'], datasets:[{data:[n,d,r], backgroundColor:['#db4040','#e9ecef','#228be6']}] }
    });
    $("#kpiNewRate").innerText = total ? ((n/total)*100).toFixed(1)+"%" : "0%";
    $("#kpiRetRate").innerText = total ? (((d+r)/total)*100).toFixed(1)+"%" : "0%";
  }
}
