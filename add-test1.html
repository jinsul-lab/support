<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>JINSUL-주소 분석 시스템 (v1.0.2)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=587d3b22c3896f92f134d03253e685bd&libraries=services&autoload=false"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
// ==========================================
//  JINSUL 시스템 통합 완성본 (v1.0.2)
// ==========================================

// 1. 전역 변수 및 상태 관리
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
let map, geocoder, places, boundsPatients, roadview, roadviewClient;
let patientRecords = [];
let radiusCircle = null, radiusCenterMarker = null, radiusCenterLatLng = null;
let radiusMeters = 1000;
let radiusPickMode = false;

const state={
  patient_new:true, patient_90:true, patient_return:true,
  target_senior:false, target_welfare:false, target_ortho:false,
  tool_distance:false, tool_roadview:false, radius_enabled:false
};

// 2. 카카오맵 초기화
function initKakao(){
  if(!window.kakao || !kakao.maps){ setTimeout(initKakao, 100); return; }
  
  kakao.maps.load(()=>{
    map = new kakao.maps.Map(document.getElementById("map"), {
      center: new kakao.maps.LatLng(37.5665,126.9780), level: 5
    });
    geocoder = new kakao.maps.services.Geocoder();
    places = new kakao.maps.services.Places();
    boundsPatients = new kakao.maps.LatLngBounds();
    
    // 줌 컨트롤
    $("#btnZoomIn").addEventListener("click",()=>map.setLevel(map.getLevel()-1));
    $("#btnZoomOut").addEventListener("click",()=>map.setLevel(map.getLevel()+1));
    
    // 로드뷰
    roadview = new kakao.maps.Roadview(document.getElementById('roadview'));
    roadviewClient = new kakao.maps.RoadviewClient();
    $("#btnCloseRoadview").addEventListener("click", ()=>{ 
      $("#roadviewPanel").classList.remove("show"); 
      state.tool_roadview=false;
      const t = document.querySelector('[data-toggle="tool_roadview"]');
      if(t) t.classList.remove("on");
    });

    // 지도 이벤트
    kakao.maps.event.addListener(map, "idle", updatePatientStats);
    kakao.maps.event.addListener(map, "click", (e)=>{
      if(radiusPickMode){
        radiusCenterLatLng = e.latLng;
        radiusPickMode = false;
        renderRadius(); applyPatientVisibility(); updatePatientStats();
        toast("반경 중심이 설정되었습니다.");
        return;
      }
      if(state.tool_roadview){
        const pos = e.latLng;
        roadviewClient.getNearestPanoId(pos, 50, (panoId)=>{
          if(panoId){
            $("#roadviewPanel").classList.add("show");
            roadview.setPanoId(panoId, pos);
          } else { toast("이 위치에 로드뷰가 없습니다."); }
        });
      }
    });

    // 토글 버튼 연결
    $$(".toggle").forEach(t=>t.addEventListener("click",()=>{
      const name=t.getAttribute("data-toggle");
      t.classList.toggle("on");
      state[name] = t.classList.contains("on");
      
      if(name.startsWith("patient_")) { applyPatientVisibility(); updatePatientStats(); }
      if(name==="tool_roadview") { 
        if(!state.tool_roadview) $("#roadviewPanel").classList.remove("show");
        else toast("지도 위를 클릭하면 로드뷰가 표시됩니다.");
      }
      if(name==="radius_enabled") { renderRadius(); applyPatientVisibility(); updatePatientStats(); }
    }));

    // 반경 슬라이더/버튼
    $("#radiusSlider").addEventListener("input", (e)=>{
      radiusMeters = parseInt(e.target.value);
      $("#radiusLabel").textContent = radiusMeters + "m";
      if(state.radius_enabled) { renderRadius(); applyPatientVisibility(); updatePatientStats(); }
    });
    $("#btnPickRadiusCenter").addEventListener("click", ()=>{
      radiusPickMode = true; toast("지도에서 반경 중심점을 클릭하세요.");
    });
    $("#btnClearRadius").addEventListener("click", ()=>{
      radiusCenterLatLng = null; renderRadius(); applyPatientVisibility(); updatePatientStats();
    });

    toast("시스템 준비 완료");
  });
}
initKakao();

// 3. 파일 업로드 핸들러
const fileInput = $("#fileInput");
const uploadBox = $("#uploadBox");

if(fileInput && uploadBox){
  fileInput.addEventListener("change", (e)=>{
    if(e.target.files.length>0) handleFile(e.target.files[0]);
    e.target.value="";
  });
  uploadBox.addEventListener("dragover", (e)=>{ e.preventDefault(); uploadBox.style.background="rgba(34,139,230,.15)"; });
  uploadBox.addEventListener("dragleave", (e)=>{ e.preventDefault(); uploadBox.style.background=""; });
  uploadBox.addEventListener("drop", (e)=>{
    e.preventDefault(); uploadBox.style.background="";
    if(e.dataTransfer.files.length>0) handleFile(e.dataTransfer.files[0]);
  });
}

// 버튼 연결 (초기화)
$("#btnClearPatients").addEventListener("click", ()=>{
  patientRecords.forEach(r => r.marker && r.marker.setMap(null));
  patientRecords = [];
  boundsPatients = new kakao.maps.LatLngBounds();
  updatePatientStats();
  toast("초기화 완료");
});
$("#btnFitPatients").addEventListener("click", ()=>{
  if(boundsPatients && !boundsPatients.isEmpty()) map.setBounds(boundsPatients);
});

async function handleFile(file){
  try{
    toast("파일 분석 중...");
    const workbook = await parseWorkbookFromFile(file); 
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rawData = XLSX.utils.sheet_to_json(sheet, {header:1});
    
    let headerIndex = -1;
    let headers = [];
    for(let i=0; i<Math.min(rawData.length, 30); i++){
      const rowStr = rawData[i].join(" ");
      if((rowStr.includes("주소")||rowStr.includes("도로명")) && (rowStr.includes("이름")||rowStr.includes("수진자"))){
        headerIndex = i; headers = rawData[i]; break;
      }
    }
    if(headerIndex<0) { toast("유효한 헤더를 찾을 수 없습니다."); return; }

    const bodyRows = XLSX.utils.sheet_to_json(sheet, {range:headerIndex});
    const patients = mergePatientData(bodyRows, headers);
    processDataAndMap(patients);

  }catch(e){
    console.error(e);
    toast("파일 처리 오류: " + e.message);
  }
}

// 4. 데이터 병합 및 분류
function mergePatientData(rows, headers){
  const patientMap = new Map();
  const typeCol = headers.find(h => ["신규","신환","초진","구분"].some(k => String(h).includes(k)));

  rows.forEach(item => {
    const title = findValueByFuzzyKey(item, ['수진자','이름','name']);
    const address = findValueByFuzzyKey(item, ['주소','addr']);
    const chartNo = findValueByFuzzyKey(item, ['차트','환자번호','ID']);
    
    if(!chartNo) return; 
    if(!address || String(address).length < 2) return;

    let isNew=false, is90=false, isRet=false;
    if(typeCol){
      const val = String(item[typeCol]??"").trim();
      if(val==="1"||val==="Y"||val.includes("신규")||val.includes("신환")||val.includes("초진")) isNew=true;
      else if(val.includes("90") || val==="90일초") is90=true;
      else isRet=true;
    } else {
      const key = `ID:${chartNo}`;
      if(!patientMap.has(key)) isNew=true; else isRet=true;
    }

    const key = `ID:${chartNo}`;
    if(patientMap.has(key)){
      const rec = patientMap.get(key);
      rec.visits++;
      if(is90) rec.latestType="90일초";
      else if(isNew) rec.latestType="신환";
      else rec.latestType="재진";
      
      if(isNew) rec.types.new=true;
      if(is90) rec.types.d90=true;
      if(isRet) rec.types.ret=true;
    } else {
      let lType = "재진";
      if(is90) lType="90일초"; else if(isNew) lType="신환";
      
      patientMap.set(key, {
        key, title, address, chartNo, visits:1,
        types: { new:isNew, d90:is90, ret:isRet },
        latestType: lType,
        marker: null, latlng: null
      });
    }
  });
  return Array.from(patientMap.values());
}

// 5. 지도 표시 및 마커
function processDataAndMap(uniquePatients){
  if(!map || !geocoder) return;
  patientRecords.forEach(r => r.marker && r.marker.setMap(null));
  patientRecords = [];
  boundsPatients = new kakao.maps.LatLngBounds();

  let success=0;
  uniquePatients.forEach((item, idx) => {
    setTimeout(()=>{
      geocodeAddress(item.address, (coords, meta)=>{
        if(!coords) return;

        const color = visitColor(item.visits);
        const iconChar = typeIcon(item.latestType);
        
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
            <circle cx="15" cy="15" r="14" fill="${color}" stroke="white" stroke-width="2" />
            <text x="15" y="20" font-size="16" text-anchor="middle" fill="white" font-weight="bold">${iconChar}</text>
          </svg>`;
          
        const markerImage = new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg),
          new kakao.maps.Size(30, 30)
        );

        const marker = new kakao.maps.Marker({
          map: map, position: coords, image: markerImage, title: item.title,
          zIndex: item.latestType==="신환" ? 10 : 1
        });

        item.marker = marker;
        item.latlng = coords;
        item.dong = meta.dong || "미상";
        
        const iwContent = `<div class="iwBox"><b>${item.title}</b><br>${item.address}<br>
                           <span style="color:${color}">${item.latestType}</span> (${item.visits}회)</div>`;
        const iw = new kakao.maps.InfoWindow({ content: iwContent, removable:true });
        kakao.maps.event.addListener(marker, 'click', ()=> iw.open(map, marker));

        patientRecords.push(item);
        boundsPatients.extend(coords);
        success++;
        
        if(idx === uniquePatients.length-1){
          map.setBounds(boundsPatients);
          updatePatientStats();
          toast(`완료: ${success}명 지도 표시`);
        }
      });
    }, idx * 30);
  });
}

// 6. 통계 및 반경 로직 (복구됨)
function updatePatientStats(){
  if(!map) return;
  const bounds = map.getBounds();
  let unique=0, visits=0;
  
  // 차트 데이터용
  const dongMap = {}; 

  patientRecords.forEach(r => {
    // 1. 토글 필터
    if(r.latestType==="신환" && !state.patient_new) return;
    if(r.latestType==="90일초" && !state.patient_90) return;
    if(r.latestType==="재진" && !state.patient_return) return;
    
    // 2. 위치 필터 (반경 or 화면)
    if(state.radius_enabled && radiusCenterLatLng){
      if(!isInsideRadius(r.latlng)) return;
    } else {
      if(!bounds.contain(r.latlng)) return;
    }

    unique++;
    visits += r.visits;
    
    // 동별 집계
    const d = r.dong || "미상";
    dongMap[d] = (dongMap[d]||0) + 1;
  });

  $("#statPatientsUnique").textContent = unique;
  $("#statPatientsVisits").textContent = visits;
  
  // 동별 테이블 업데이트
  const sortedDong = Object.entries(dongMap).sort((a,b)=>b[1]-a[1]);
  const tblHtml = sortedDong.map(([d,c])=> `<tr><td>${d}</td><td colspan="4" style="text-align:right"><b>${c}</b></td></tr>`).join("");
  const tblEl = document.getElementById("tblDongType");
  if(tblEl) tblEl.innerHTML = tblHtml;
}

function applyPatientVisibility(){ 
  updatePatientStats(); // 통계 갱신 시 마커 제어 로직이 중복되므로, 통계 함수 내 필터 로직과 마커 setMap을 동기화하는 것이 좋음
  // 여기서는 단순 마커 표시/숨김만 처리
  patientRecords.forEach(r => {
    let show = true;
    if(r.latestType==="신환" && !state.patient_new) show=false;
    if(r.latestType==="90일초" && !state.patient_90) show=false;
    if(r.latestType==="재진" && !state.patient_return) show=false;
    
    if(show && state.radius_enabled && radiusCenterLatLng){
      if(!isInsideRadius(r.latlng)) show=false;
    }
    r.marker.setMap(show ? map : null);
  });
}

// 반경 관련 함수
function isInsideRadius(latlng){
  if(!radiusCenterLatLng) return true;
  const poly = new kakao.maps.Polyline({ path: [radiusCenterLatLng, latlng] });
  return poly.getLength() <= radiusMeters;
}

function renderRadius(){
  if(!map) return;
  if(radiusCircle) radiusCircle.setMap(null);
  if(radiusCenterMarker) radiusCenterMarker.setMap(null);

  if(state.radius_enabled && radiusCenterLatLng){
    radiusCircle = new kakao.maps.Circle({
      center: radiusCenterLatLng, radius: radiusMeters,
      strokeWeight: 1, strokeColor: '#228be6', strokeOpacity: 0.7,
      fillColor: '#228be6', fillOpacity: 0.1
    });
    radiusCircle.setMap(map);
    
    radiusCenterMarker = new kakao.maps.Marker({
      position: radiusCenterLatLng, map: map, draggable:true
    });
    kakao.maps.event.addListener(radiusCenterMarker, 'dragend', ()=>{
      radiusCenterLatLng = radiusCenterMarker.getPosition();
      renderRadius(); applyPatientVisibility(); updatePatientStats();
    });
  }
}

// 7. 헬퍼 함수
function normalizeAddress(s){
  return String(s).replace(/\((.*?)\)/g, (match, inParens)=>{
    return /\d+동/.test(inParens) ? " " + inParens : "";
  }).replace(/\s+/g," ").trim();
}

function geocodeAddress(addr, cb){
  const clean = normalizeAddress(addr);
  geocoder.addressSearch(clean, (res, status)=>{
    if(status===kakao.maps.services.Status.OK && res[0]){
      const coords = new kakao.maps.LatLng(res[0].y, res[0].x);
      let dName = "";
      if(res[0].address && res[0].address.region_3depth_name) dName = res[0].address.region_3depth_name;
      else if(res[0].road_address && res[0].road_address.region_3depth_name) dName = res[0].road_address.region_3depth_name;
      cb(coords, {dong: dName});
    } else {
      cb(null, {});
    }
  });
}

function findValueByFuzzyKey(obj, keys){
  const kFound = Object.keys(obj).find(k => keys.some(wk => k.replace(/\s/g,'').includes(wk)));
  return kFound ? obj[kFound] : null;
}

function visitColor(v){
  if(v>=5) return "#db4040"; 
  if(v===4) return "orange";
  if(v===3) return "#CCCC00"; 
  if(v===2) return "green";
  return "#228be6"; 
}

function typeIcon(t){
  if(t==="신환") return "♥";
  if(t==="90일초") return "♡";
  return ""; 
}

async function parseWorkbookFromFile(file){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onload = (e)=>{
      const data = new Uint8Array(e.target.result);
      const isXlsx = (data[0]===0x50 && data[1]===0x4B);
      if(isXlsx) resolve(XLSX.read(data, {type:'array'}));
      else {
        try {
          const str = Encoding.convert(data, {to:'UNICODE', from:'EUC-KR', type:'string'});
          resolve(XLSX.read(str, {type:'string'}));
        } catch(err) { reject(err); }
      }
    };
    fr.readAsArrayBuffer(file);
  });
}

function toast(msg){
  const t = document.getElementById("toast");
  if(t){ t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 3000); }
}
</script>
</body>
</html>
