<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>현수막 게시대 지도 (실동작)</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_APP_KEY"></script>
<style>
html,body,#map{width:100%;height:100%;margin:0;padding:0;}
.btn{position:absolute;top:10px;left:10px;z-index:10;padding:8px 12px;background:#000;color:#fff;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div id="map"></div>
<div class="btn" onclick="toggle()">🪧 현수막 게시대</div>

<script>
var map = new kakao.maps.Map(document.getElementById('map'), {
  center: new kakao.maps.LatLng(37.5665,126.9780),
  level:7
});

var overlays = [];
var on = false;

async function load(){
  if(overlays.length>0) return;

  const url =
  "http://api.data.go.kr/openapi/tn_pubr_public_banner_api"
  + "?serviceKey=c8955eba86e3853af8e9d4c6ca072b7d7d0158630d11296129824c3eb4f4c426"
  + "&pageNo=0&numOfRows=1000&type=json";

  const res = await fetch(url);
  const json = await res.json();
  const items = json.response.body.items.item || [];

  items.forEach(i=>{
    if(!i.LAT || !i.LOT) return;
    const ov = new kakao.maps.CustomOverlay({
      position:new kakao.maps.LatLng(i.LAT,i.LOT),
      content:"<div style='background:#fff;border:1px solid #333;padding:4px;font-size:11px'>🪧 현수막</div>",
      yAnchor:1
    });
    overlays.push(ov);
  });
}

function toggle(){
  on=!on;
  if(on){
    load().then(()=>overlays.forEach(o=>o.setMap(map)));
  }else{
    overlays.forEach(o=>o.setMap(null));
  }
}
</script>
</body>
</html>
